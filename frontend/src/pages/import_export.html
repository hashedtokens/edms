<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Import / Export</title>


    <link href="../styles/output.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Flash-prevention: set theme class before first paint -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.toggle('dark', theme === 'dark');
        })();
    </script>

</head>


<body
    class="min-h-screen bg-slate-100 dark:bg-slate-950 font-[Inter] text-slate-800 dark:text-slate-100 transition-colors">

    <!-- PAGE -->
    <div class="min-h-screen p-2 sm:p-3">
        <div class="mx-auto flex min-h-[calc(100vh-1.5rem)]
                    max-w-screen-2xl flex-col
                    overflow-hidden
                    rounded-xl
                    border border-slate-300 dark:border-slate-700
                    bg-slate-50 dark:bg-slate-900">


            <header class="flex shrink-0 flex-wrap
                           items-center justify-between
                           gap-3
                           border-b border-slate-200 dark:border-slate-700/40
                           bg-slate-50 dark:bg-[#162235]
                           px-3 py-2
                           sm:px-4">


                <a href="./index.html" class="brand
flex
items-center
gap-2.5
shrink-0
group">

                    <span class="text-lg
    font-bold
    tracking-tight
    text-slate-900 dark:text-white">
                        Logo HashedTokens EDMS
                    </span>

                </a>

                <!-- Header actions: nav + theme toggle -->
                <div class="flex items-center gap-2">

                    <nav class="navbar
                    flex
                    items-center
                    gap-1
                    rounded
                    bg-slate-100 dark:bg-slate-800
                    p-1">


                        <!-- Home -->
                        <button id="homenav" data-target="./index.html" data-page="home" class="nav-button
                           rounded 
                           px-3.5 py-1.5
                           text-sm
                           font-medium
                           text-slate-500 dark:text-slate-400
                           transition
                           hover:bg-slate-200 dark:hover:bg-slate-700
                           hover:text-slate-900 dark:hover:text-white">

                            Home

                        </button>


                        <!-- Test View -->
                        <button id="testnav" data-target="./testview.html" data-page="test" class="nav-button
                            rounded    
                           px-3.5 py-1.5
                           text-sm
                           font-medium
                           text-slate-500 dark:text-slate-400
                           transition
                           hover:bg-slate-200 dark:hover:bg-slate-700
                           hover:text-slate-900 dark:hover:text-white">

                            Test View

                        </button>
                        <!-- Bookmark View -->
                        <button id="listnav" data-target="./listview.html" data-page="list" class="nav-button
                           rounded
                           px-3.5 py-1.5
                           text-sm
                           font-medium
                           text-slate-500 dark:text-slate-400
                           transition
                           hover:bg-slate-200 dark:hover:bg-slate-700
                           hover:text-slate-900 dark:hover:text-white">

                            Bookmark View
                        </button>
                        <!-- Collection View -->
                        <button id="collectionnav" data-target="./collection_view.html" data-page="collection" class="nav-button
                           rounded
                           px-3.5 py-1.5
                           text-sm
                           font-medium
                           text-slate-500 dark:text-slate-400
                           transition
                           hover:bg-slate-200 dark:hover:bg-slate-700
                           hover:text-slate-900 dark:hover:text-white">

                            Collection View
                        </button>
                        <!-- Import / Export -->
                        <button id="importexportnav" data-target="./import_export.html" data-page="import_export" class="nav-button
                           rounded
                           px-3.5 py-1.5
                           text-sm
                           font-medium
                           bg-slate-900 dark:bg-cyan-500
                           text-white
                           shadow-lg
                           shadow-slate-900/30 dark:shadow-cyan-500/30">

                            Import / Export

                        </button>

                        <!-- Repo View -->
                        <button id="reponav" data-target="./repoview.html" data-page="repo" class="nav-button
                           rounded
                           px-3.5 py-1.5
                           text-sm
                           font-medium
                           text-slate-500 dark:text-slate-400
                           transition
                           hover:bg-slate-200 dark:hover:bg-slate-700
                           hover:text-slate-900 dark:hover:text-white">

                            Repo View
                        </button>
                    </nav>

                    <!-- Theme toggle -->
                    <button id="themeToggle" type="button" title="Toggle theme" class="
                    flex items-center justify-center
                    h-8 w-8
                    rounded-full
                    bg-slate-200 dark:bg-slate-700
                    text-slate-700 dark:text-slate-200
                    border border-slate-300 dark:border-slate-600
                    transition
                    hover:bg-slate-300 dark:hover:bg-slate-600
                    hover:text-slate-900 dark:hover:text-white
                    hover:border-cyan-400/50">

                        <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="w-4 h-4 hidden">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path
                                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
                            </path>
                        </svg>

                        <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="w-4 h-4">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
                        </svg>
                    </button>

                </div>


            </header>
            <!-- MAIN CONTENT -->
            <main class="min-h-0 flex-1 overflow-auto p-4 sm:p-6"> <!-- IMPORT / EXPORT TABLE -->
                <section class="overflow-hidden
                                rounded-lg
                                border border-slate-300 dark:border-slate-700
                                bg-slate-50 dark:bg-slate-900">


                    <!-- Search / Filters / Actions -->

                    <div class="flex flex-wrap
                    items-center
                    justify-between
                   gap-2
border-b border-slate-200 dark:border-slate-700
px-3 py-2.5">


                        <div class="flex flex-wrap
                        items-center
                        gap-2">

                            <!-- Search -->

                            <div class="relative
                    min-w-[180px]
                    flex-1
                    sm:max-w-xs">

                                <svg class="pointer-events-none
                        absolute left-2.5
                        top-1/2
                        h-4 w-4
                        -translate-y-1/2
                        text-slate-400 dark:text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">

                                    <circle cx="11" cy="11" r="7" />
                                    <path d="m20 20-3.5-3.5" />

                                </svg>

                                <input id="importExportSearch" type="search" placeholder="Search imports / exports..."
                                    class="h-8
                       w-full
                       rounded-lg
                       border border-slate-300 dark:border-slate-800
                       bg-slate-100 dark:bg-slate-800/80
                       pl-8 pr-3
                       text-xs
                       text-slate-900 dark:text-slate-300
                       outline-none
                       transition
                       focus:border-cyan-500
                       focus:ring-1
                       focus:ring-cyan-500/30">

                            </div>
                            <select id="typeFilter" class="h-8
                        rounded-lg
                        border border-slate-300 dark:border-slate-800
                        bg-slate-100 dark:bg-slate-800
                        px-2.5
                        text-xs
                        text-slate-900 dark:text-slate-300
                        outline-none
                        focus:border-cyan-500">

                                <option value="all">
                                    All Types
                                </option>

                                <option value="Import">
                                    Import
                                </option>

                                <option value="Export">
                                    Export
                                </option>

                            </select>

                            <select id="purposeFilter" class="h-8
                        rounded-lg
                        border border-slate-300 dark:border-slate-800
                        bg-slate-100 dark:bg-slate-800
                        px-2.5
                        text-xs
                        text-slate-900 dark:text-slate-300
                        outline-none
                        focus:border-cyan-500">

                                <option value="all">
                                    All Purposes
                                </option>

                                <option value="Collections">
                                    Collections
                                </option>

                                <option value="RepoView">
                                    RepoView
                                </option>

                                <option value="WebView">
                                    WebView
                                </option>

                            </select>
                            <button id="resetFilters" type="button" class="inline-flex
                            h-8
                            items-center
                            gap-1.5
                            rounded-md
                            border border-slate-300 dark:border-slate-700
                            bg-slate-100 dark:bg-slate-800
                            px-2.5
                            text-xs
                            text-slate-600 dark:text-slate-300
                            transition
                            hover:bg-slate-200 dark:hover:bg-slate-700">

                                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">

                                    <path d="M3 12a9 9 0 0 1 15.3-6.4L21 8" />
                                    <path d="M21 3v5h-5" />
                                    <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16" />
                                    <path d="M3 21v-5h5" />

                                </svg>

                                Reset

                            </button>
                            <!-- Compressed -->

                            <button id="compressedTab" type="button" class="rounded-md
                            bg-slate-900 dark:bg-cyan-500
                            px-3 py-2
                            text-xs
                            font-semibold
                            text-white dark:text-slate-950
                            transition
                   hover:bg-slate-300 dark:hover:bg-slate-700">

                                Compressed

                            </button>


                            <!-- Uncompressed -->

                            <button id="uncompressedTab" type="button" class="rounded-md
                   bg-slate-200 dark:bg-slate-800
                   px-3 py-2
                   text-xs
                   font-medium
                   text-slate-600 dark:text-slate-300
                   transition
                   hover:bg-slate-300 dark:hover:bg-slate-700">
                                Uncompressed
                            </button>
                        </div>
                        <!-- RIGHT SIDE -->

                        <div class="flex items-center gap-2">

                            <!-- Import -->

                            <button id="importBtn" type="button" class="rounded-md
                        bg-slate-200 dark:bg-slate-700
                        px-4 py-2
                        text-xs
                        font-semibold
                        text-slate-700 dark:text-slate-200
                        transition
                        hover:bg-slate-300 dark:hover:bg-slate-600">
                                Import
                            </button>
                            <!-- Export -->
                            <button id="exportBtn" type="button" class="rounded-md
                                bg-slate-900 dark:bg-cyan-500
                                px-4 py-2
                                text-xs
                                font-semibold
                                text-white dark:text-slate-950
                                transition
                                hover:bg-slate-800 dark:hover:bg-cyan-400">

                                Export

                            </button>

                        </div>

                    </div>

                    <!-- TABLE -->

                    <div class="overflow-x-auto">

                        <table class="w-full
                  min-w-[800px]
                  text-left
                  text-sm">
                            <thead
                                class="border-b border-slate-200 dark:border-slate-700 bg-slate-100/60 dark:bg-slate-950/50">
                                <tr>
                                    <th class="px-3 py-2 font-medium text-slate-500 dark:text-slate-400">
                                        Folder Name
                                    </th>

                                    <th class="px-3 py-2 font-medium text-slate-500 dark:text-slate-400">
                                        Purpose
                                    </th>

                                    <th class="px-3 py-2 font-medium text-slate-500 dark:text-slate-400">
                                        Size
                                    </th>

                                    <th class="px-3 py-2 font-medium text-slate-500 dark:text-slate-400">
                                        EDMS Format Check
                                    </th>

                                </tr>

                            </thead>
                            <tbody id="importExportTable" class="divide-y divide-slate-200 dark:divide-slate-800">
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>


            <div id="contextMenu" class="fixed
           z-50
           hidden
           w-44
           rounded-md
           border border-slate-200 dark:border-slate-700
           bg-slate-50 dark:bg-slate-900
           py-1
           shadow-xl">

                <button id="formatCheckBtn" type="button" class="block
               w-full
               px-4 py-2
               text-left
               text-xs
               text-slate-600 dark:text-slate-300
               hover:bg-slate-200 dark:hover:bg-slate-800
               hover:text-slate-900 dark:hover:text-white">

                    Format Check

                </button>


                <button id="moveBtn" type="button" class="block
               w-full
               px-4 py-2
               text-left
               text-xs
               text-slate-600 dark:text-slate-300
               hover:bg-slate-200 dark:hover:bg-slate-800
               hover:text-slate-900 dark:hover:text-white">

                    Move

                </button>


                <button id="takeoutBtn" type="button" class="block
               w-full
               px-4 py-2
               text-left
               text-xs
               text-slate-600 dark:text-slate-300
               hover:bg-slate-200 dark:hover:bg-slate-800
               hover:text-slate-900 dark:hover:text-white">

                    Takeout

                </button>

            </div>

        </div>

    </div>
    <!-- EXPORT MODAL -->

    <div id="exportModal" class="fixed inset-0 z-50
                hidden
                items-center
                justify-center
                bg-slate-900/40 dark:bg-black/60
                backdrop-blur-sm">
        <div class="w-full
                    max-w-md
                    rounded-lg
                    border border-slate-200 dark:border-slate-700
                    bg-slate-50 dark:bg-slate-900
                    p-5">
            <h2 class="text-lg
                       font-semibold
                       text-slate-900 dark:text-slate-100">

                Export Data

            </h2>
            <p class="mt-1
                      text-xs
                      text-slate-500 dark:text-slate-400">

                Select how you want to use the exported data.

            </p>
            <!-- Export Options -->
            <div class="mt-5 space-y-3">
                <!-- Sharing -->
                <label class="flex cursor-pointer
                              items-start
                              gap-3
                              rounded-md
                              border border-slate-300 dark:border-slate-700
                              p-3
                              hover:bg-slate-200 dark:hover:bg-slate-800">
                    <input type="radio" name="exportPurpose" value="Sharing" checked class="mt-1">
                    <div>

                        <p class="text-sm
                                  font-medium
                                  text-slate-700 dark:text-slate-200">

                            Sharing

                        </p>
                        <p class="mt-1
                                  text-xs
                                  text-slate-500 dark:text-slate-400">

                            Includes SQLite files for use
                            with another EDMS application.

                        </p>

                    </div>
                </label>
                <!-- External Use -->
                <label class="flex cursor-pointer
                              items-start
                              gap-3
                              rounded-md
                              border border-slate-300 dark:border-slate-700
                              p-3
                              hover:bg-slate-200 dark:hover:bg-slate-800">
                    <input type="radio" name="exportPurpose" value="External use" class="mt-1">
                    <div>
                        <p class="text-sm
                                  font-medium
                                  text-slate-700 dark:text-slate-200">
                            For external use
                        </p>
                        <p class="mt-1
                                  text-xs
                                  text-slate-500 dark:text-slate-400">

                            For RepoView or WebView use.
                            SQLite files are not included.
                        </p>
                    </div>
                </label>
            </div>


            <!-- Modal Buttons -->
            <div class="mt-5
                        flex
                        justify-end
                        gap-2">
                <button id="cancelExport" type="button" class="rounded-md
                               border border-slate-300 dark:border-slate-700
                               px-4 py-2
                               text-xs
                               text-slate-600 dark:text-slate-300
                               transition
                               hover:bg-slate-200 dark:hover:bg-slate-800">
                    Cancel
                </button>

                <button id="confirmExport" type="button" class="rounded-md
                               bg-slate-900 dark:bg-cyan-500
                               px-4 py-2
                               text-xs
                               font-semibold
                               text-white dark:text-slate-950
                               transition
                               hover:bg-slate-800 dark:hover:bg-cyan-400">
                    Export
                </button>
            </div>
        </div>
    </div>

    <script src="../js/nav-bar.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/import-export/import_export.js"></script>

</body>

</html>
