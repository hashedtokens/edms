<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Import / Export</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="../styles/output.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>


<body class="min-h-screen bg-slate-950 font-[Inter] text-slate-100">

    <!-- PAGE -->
    <div class="min-h-screen p-3 sm:p-4">

        <div class="mx-auto flex min-h-[calc(100vh-1.5rem)]
                    max-w-screen-2xl flex-col
                    overflow-hidden
                    rounded-xl
                    border border-slate-800
                    bg-slate-900">


            <header class="flex shrink-0 flex-wrap
                           items-center justify-between
                           gap-3
                           border-b border-slate-700/40
                           bg-[#162235]
                           px-4 py-3
                           sm:px-6">


                <div class="flex min-w-0 flex-col gap-0.5">

                    <h1 class="truncate
                               text-xl font-bold
                               tracking-tight
                               text-white
                               sm:text-2xl">

                        Import / Export

                    </h1>

                    <p class="text-xs text-slate-400">

                        Manage imported and exported EDMS data

                    </p>

                </div>


                <!-- Navigation -->
                <nav class="navbar
                            flex
                            items-center
                            gap-1
                            rounded-full
                            bg-slate-800
                            p-1">


                    <!-- Home -->
                    <button id="homenav" data-target="./index.html" data-page="home" class="nav-button
                                   rounded-lg
                                   px-3.5 py-1.5
                                   text-sm
                                   font-medium
                                   text-slate-400
                                   transition
                                   hover:bg-slate-700
                                   hover:text-white">

                        Home

                    </button>


                    <!-- Test View -->
                    <button id="testnav" data-target="./testview.html" data-page="test" class="nav-button
                                   rounded-lg
                                   px-3.5 py-1.5
                                   text-sm
                                   font-medium
                                   text-slate-400
                                   transition
                                   hover:bg-slate-700
                                   hover:text-white">

                        Test View

                    </button>
                    <!-- Bookmark View -->
                    <button id="listnav" data-target="./listview.html" data-page="list" class="nav-button
                                   rounded-lg
                                   px-3.5 py-1.5
                                   text-sm
                                   font-medium
                                   text-slate-400
                                   transition
                                   hover:bg-slate-700
                                   hover:text-white">

                        Bookmark View
                    </button>
                    <!-- Collection View -->
                    <button id="collectionnav" data-target="./collection_view.html" data-page="collection" class="nav-button
                                   rounded-lg
                                   px-3.5 py-1.5
                                   text-sm
                                   font-medium
                                   text-slate-400
                                   transition
                                   hover:bg-slate-700
                                   hover:text-white">

                        Collection View
                    </button>
                    <!-- Import / Export -->
                    <button id="importexportnav" data-target="./import_export.html" data-page="import_export" class="nav-button
                                     px-3.5
                        py-1.5
                        rounded-lg
                        text-sm
                        font-medium
                        bg-cyan-500
                        text-white
                        shadow-lg
                        shadow-cyan-500/30">

                        Import / Export
                    </button>


                    <!-- Repo View -->
                    <button id="reponav" data-target="./repoview.html" data-page="repo" class="nav-button
                                   rounded-lg
                                   px-3.5 py-1.5
                                   text-sm
                                   font-medium
                                   text-slate-400
                                   transition
                                   hover:bg-slate-700
                                   hover:text-white">

                        Repo View
                    </button>
                </nav>

            </header>
            <!-- MAIN CONTENT -->
            <main class="min-h-0 flex-1 overflow-auto p-4 sm:p-6">
                <!-- IMPORT / EXPORT TABLE -->
                <section class="overflow-hidden
                                rounded-lg
                                border border-slate-800
                                bg-slate-900">


                    <!-- Search / Filters / Actions -->

                    <div class="flex flex-wrap
                    items-center
                    justify-between
                    gap-2
                    border-b border-slate-800
                    px-5 py-4">


                        <div class="flex flex-wrap
                        items-center
                        gap-2">

                            <!-- Search -->

                            <div class="relative
                    min-w-[180px]
                    flex-1
                    sm:max-w-xs">

                                <svg class="pointer-events-none
                        absolute left-2.5
                        top-1/2
                        h-4 w-4
                        -translate-y-1/2
                        text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">

                                    <circle cx="11" cy="11" r="7" />
                                    <path d="m20 20-3.5-3.5" />

                                </svg>

                                <input id="importExportSearch" type="search" placeholder="Search imports / exports..."
                                    class="h-8
                       w-full
                       rounded-md
                       border border-slate-800
                       bg-slate-800/80
                       pl-8 pr-3
                       text-xs
                       text-slate-300
                       outline-none
                       transition
                       focus:border-cyan-500
                       focus:ring-1
                       focus:ring-cyan-500/30">

                            </div>
                            <select id="typeFilter" class="h-8
                        rounded-md
                        border border-slate-800
                        bg-slate-800
                        px-2.5
                        text-xs
                        text-slate-300
                        outline-none
                        focus:border-cyan-500">

                                <option value="all">
                                    All Types
                                </option>

                                <option value="Import">
                                    Import
                                </option>

                                <option value="Export">
                                    Export
                                </option>

                            </select>

                            <select id="purposeFilter" class="h-8
                        rounded-md
                        border border-slate-800
                        bg-slate-800
                        px-2.5
                        text-xs
                        text-slate-300
                        outline-none
                        focus:border-cyan-500">

                                <option value="all">
                                    All Purposes
                                </option>

                                <option value="Collections">
                                    Collections
                                </option>

                                <option value="RepoView">
                                    RepoView
                                </option>

                                <option value="WebView">
                                    WebView
                                </option>

                            </select>
                            <button id="resetFilters" type="button" class="inline-flex
                            h-8
                            items-center
                            gap-1.5
                            rounded-md
                            border border-slate-700
                            bg-slate-800
                            px-2.5
                            text-xs
                            text-slate-300
                            transition
                            hover:bg-slate-700">

                                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="1.8">

                                    <path d="M3 12a9 9 0 0 1 15.3-6.4L21 8" />
                                    <path d="M21 3v5h-5" />
                                    <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16" />
                                    <path d="M3 21v-5h5" />

                                </svg>

                                Reset

                            </button>
                            <!-- Compressed -->

                            <button id="compressedTab" type="button" class="rounded-md
                            bg-cyan-500
                            px-3 py-2
                            text-xs
                            font-semibold
                            text-slate-950
                            transition
                            hover:bg-cyan-400">

                                Compressed

                            </button>


                            <!-- Uncompressed -->

                            <button id="uncompressedTab" type="button" class="rounded-md
                   bg-slate-800
                   px-3 py-2
                   text-xs
                   font-medium
                   text-slate-300
                   transition
                   hover:bg-slate-700">
                                Uncompressed
                            </button>
                        </div>
                        <!-- RIGHT SIDE -->

                        <div class="flex items-center gap-2">

                            <!-- Import -->

                            <button id="importBtn" type="button" class="rounded-md
                        bg-slate-700
                        px-4 py-2
                        text-xs
                        font-semibold
                        text-slate-200
                        transition
                        hover:bg-slate-600">
                                Import
                            </button>
                            <!-- Export -->
                            <button id="exportBtn" type="button" class="rounded-md
                                bg-cyan-500
                                px-4 py-2
                                text-xs
                                font-semibold
                                text-slate-950
                                transition
                                hover:bg-cyan-400">

                                Export

                            </button>

                        </div>

                    </div>

                    <!-- TABLE -->

                    <div class="overflow-x-auto">

                        <table class="w-full
                  min-w-[800px]
                  text-left
                  text-sm">
                            <thead class="border-b border-slate-800 bg-slate-950/50">
                                <tr>
                                    <th class="px-5 py-3 font-medium text-slate-400">
                                        Folder Name
                                    </th>

                                    <th class="px-5 py-3 font-medium text-slate-400">
                                        Purpose
                                    </th>

                                    <th class="px-5 py-3 font-medium text-slate-400">
                                        Size
                                    </th>

                                    <th class="px-5 py-3 font-medium text-slate-400">
                                        EDMS Format Check
                                    </th>

                                </tr>

                            </thead>
                            <tbody id="importExportTable" class="divide-y divide-slate-800">
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>


            <div id="contextMenu" class="fixed
           z-50
           hidden
           w-44
           rounded-md
           border border-slate-700
           bg-slate-900
           py-1
           shadow-xl">

                <button id="formatCheckBtn" type="button" class="block
               w-full
               px-4 py-2
               text-left
               text-xs
               text-slate-300
               hover:bg-slate-800
               hover:text-white">

                    Format Check

                </button>


                <button id="moveBtn" type="button" class="block
               w-full
               px-4 py-2
               text-left
               text-xs
               text-slate-300
               hover:bg-slate-800
               hover:text-white">

                    Move

                </button>


                <button id="takeoutBtn" type="button" class="block
               w-full
               px-4 py-2
               text-left
               text-xs
               text-slate-300
               hover:bg-slate-800
               hover:text-white">

                    Takeout

                </button>

            </div>

        </div>

    </div>
    <!-- EXPORT MODAL -->

    <div id="exportModal" class="fixed inset-0 z-50
                hidden
                items-center
                justify-center
                bg-black/60
                backdrop-blur-sm">
        <div class="w-full
                    max-w-md
                    rounded-lg
                    border border-slate-700
                    bg-slate-900
                    p-5">
            <h2 class="text-lg
                       font-semibold
                       text-slate-100">

                Export Data

            </h2>
            <p class="mt-1
                      text-xs
                      text-slate-400">

                Select how you want to use the exported data.

            </p>
            <!-- Export Options -->
            <div class="mt-5 space-y-3">
                <!-- Sharing -->
                <label class="flex cursor-pointer
                              items-start
                              gap-3
                              rounded-md
                              border border-slate-700
                              p-3
                              hover:bg-slate-800">
                    <input type="radio" name="exportPurpose" value="Sharing" checked class="mt-1">
                    <div>

                        <p class="text-sm
                                  font-medium
                                  text-slate-200">

                            Sharing

                        </p>
                        <p class="mt-1
                                  text-xs
                                  text-slate-400">

                            Includes SQLite files for use
                            with another EDMS application.

                        </p>

                    </div>
                </label>
                <!-- External Use -->
                <label class="flex cursor-pointer
                              items-start
                              gap-3
                              rounded-md
                              border border-slate-700
                              p-3
                              hover:bg-slate-800">
                    <input type="radio" name="exportPurpose" value="External use" class="mt-1">
                    <div>
                        <p class="text-sm
                                  font-medium
                                  text-slate-200">
                            For external use
                        </p>
                        <p class="mt-1
                                  text-xs
                                  text-slate-400">

                            For RepoView or WebView use.
                            SQLite files are not included.
                        </p>
                    </div>
                </label>
            </div>


            <!-- Modal Buttons -->
            <div class="mt-5
                        flex
                        justify-end
                        gap-2">
                <button id="cancelExport" type="button" class="rounded-md
                               border border-slate-700
                               px-4 py-2
                               text-xs
                               text-slate-300
                               transition
                               hover:bg-slate-800">
                    Cancel
                </button>

                <button id="confirmExport" type="button" class="rounded-md
                               bg-cyan-500
                               px-4 py-2
                               text-xs
                               font-semibold
                               text-slate-950
                               transition
                               hover:bg-cyan-400">
                    Export
                </button>
            </div>
        </div>
    </div>

    <script src="../js/nav-bar.js"></script>
    <script src="../js/import_export/import_export.js"></script>

</body>

</html>
