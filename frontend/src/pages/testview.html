                            gap: 1rem;
                            padding: 1.5rem;
                            background: rgb(241 245 249 / 0.98);
                        }

                        html.dark #reqResGroup.zoomed {
                            background: rgb(15 23 42 / 0.98);
                        }

                        #reqResGroup.zoomed .request,
                        #reqResGroup.zoomed .response {
                            height: 100%;
                        }
                    </style>

                    <script>
                        (function () {
                            const reqResGroup = document.getElementById('reqResGroup');
                            const fullscreenBtns = [
                                document.getElementById('requestFullscreen'),
                                document.getElementById('responseFullscreen')
                            ];

                            function toggleZoom() {
                                const isZoomed = reqResGroup.classList.toggle('zoomed');
                                document.body.classList.toggle('overflow-hidden', isZoomed);
                            }

                            fullscreenBtns.forEach(btn => btn?.addEventListener('click', toggleZoom));

                            document.addEventListener('keydown', (e) => {
                                if (e.key === 'Escape' && reqResGroup.classList.contains('zoomed')) {
                                    reqResGroup.classList.remove('zoomed');
                                    document.body.classList.remove('overflow-hidden');
                                }
                            });
                        })();
