<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EDMS - Test View</title>
    <link rel="icon" type="image/png" href="../images/logo.png" />

    <link href="../styles/output.css" rel="stylesheet" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      #endpointsTab:not(.border-sky-500) {
        border-color: transparent;
      }
    </style>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Flash-prevention: set theme class before first paint -->
    <script>
      (function () {
        const theme = localStorage.getItem("theme") || "dark";
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>

  <body
    class="min-h-screen overflow-hidden antialiased font-[Inter] transition-colors bg-slate-100 dark:bg-[#020617] text-slate-800 dark:text-slate-100"
    data-current-page="test"
  >
    <div class="h-screen p-3">
      <!-- APP -->
      <div
        class="app mx-auto flex h-full max-w-screen-2xl flex-col overflow-hidden rounded-xl border bg-slate-100 dark:bg-[#111827] border-slate-300 dark:border-slate-700/40"
      >
        <!-- HEADER -->
        <header
          class="flex shrink-0 flex-wrap items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-700/40 bg-slate-100 dark:bg-[#162235] px-3 py-2 sm:px-4"
        >
          <!-- Logo / Title + collection context -->
          <div class="flex items-center gap-3">
            <a
              href="./index.html"
              class="brand group flex shrink-0 items-center gap-2.5"
            >
              <img
                src="../images/logo.png"
                alt="HashedTokens"
                class="h-8 w-auto object-contain"
              />
              <span
                class="text-lg font-bold tracking-tight text-slate-800 dark:text-white"
              >
                HashedTokens EDMS
              </span>
            </a>

            <div id="collectionContextBanner" class="hidden items-center gap-2">
              <span class="text-slate-400 dark:text-slate-600">/</span>
              <span class="text-[11px] text-slate-500 dark:text-slate-400"
                >Collection:</span
              >
              <span
                id="collectionContextName"
                class="font-mono text-sm font-semibold text-cyan-600 dark:text-cyan-400"
                >—</span
              >
              <span
                id="collectionContextCount"
                class="rounded-md bg-cyan-500/10 px-2 py-0.5 text-[10px] font-medium text-cyan-600 dark:text-cyan-400"
                >— endpoints</span
              >
            </div>
          </div>

          <!-- Header actions: nav + theme toggle -->
          <div class="flex items-center gap-2">
            <!-- Navigation -->
            <nav
              class="navbar flex items-center gap-1 rounded bg-slate-100 p-1 dark:bg-transparent"
            >
              <button
                id="homenav"
                data-target="./index.html"
                data-page="home"
                class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500 transition hover:bg-slate-200 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white"
              >
                Home
              </button>

              <!-- Test View (active) -->
              <button
                id="testnav"
                data-target="./testview.html"
                data-page="test"
                class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-white bg-slate-900 dark:bg-cyan-500 shadow-lg shadow-slate-900/30 dark:shadow-cyan-500/30"
              >
                Test View
              </button>

              <button
                id="collectionnav"
                data-target="./collection_view.html"
                data-page="collection"
                class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500 transition hover:bg-slate-200 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white"
              >
                Collections
              </button>

              <button
                id="reponav"
                data-target="./repoview.html"
                data-page="repo"
                class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500 transition hover:bg-slate-200 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white"
              >
                Repo View
              </button>

              <button
                id="webnav"
                data-target="./webview.html"
                data-page="web"
                class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500 transition hover:bg-slate-200 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white"
              >
                Web View
              </button>
              <button
                id="importexportnav"
                data-target="./import_export.html"
                data-page="import_export"
                class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500 transition hover:bg-slate-200 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white"
              >
                Import / Export
              </button>
            </nav>

            <!-- Theme toggle -->
            <button
              id="themeToggle"
              type="button"
              title="Toggle theme"
              class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 transition hover:bg-slate-300 dark:hover:bg-slate-600 hover:text-slate-900 dark:hover:text-white hover:border-cyan-400/50"
            >
              <svg
                id="iconSun"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="hidden h-4 w-4"
              >
                <circle cx="12" cy="12" r="4"></circle>
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
                ></path>
              </svg>

              <svg
                id="iconMoon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="h-4 w-4"
              >
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"
                ></path>
              </svg>
            </button>
          </div>
        </header>

        <!-- MAIN -->

        <main class="main flex flex-1 min-h-0">
          <!-- SIDEBAR -->

          <aside
            id="testSidebar"
            class="sidebar w-[32%] h-full border-r border-slate-300 dark:border-slate-700/40 bg-slate-50 dark:bg-[#101827] flex flex-col min-h-0 transition-all duration-200 overflow-hidden"
          >
            <!-- SIDEBAR TOP STRIP -->

            <div
              class="flex items-center justify-between px-3 h-9 border-b border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-900 shrink-0"
            >
              <span
                class="text-[11px] font-semibold text-slate-500 uppercase tracking-wide"
              >
                Panel
              </span>

              <button
                id="sidebarCollapseToggle"
                type="button"
                title="Collapse sidebar"
                class="p-1 rounded-md text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 hover:text-cyan-600 dark:hover:text-cyan-400 transition"
              >
                <svg
                  class="icon-collapse w-4 h-4"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>

                <svg
                  class="icon-expand w-4 h-4 hidden"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>

            <!-- SIDEBAR CONTENT -->

            <div id="sidebarContent" class="flex flex-col flex-1 min-h-0">
              <!-- TABS -->
              <div
                class="tabs flex items-stretch gap-2 px-4 h-10 bg-slate-100 dark:bg-slate-900 shrink-0"
              >
                <button
                  id="historyTab"
                  type="button"
                  class="flex-1 px-2 h-full text-sm font-medium border-b-2 border-transparent text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:border-sky-400/60 transition-colors"
                >
                  History
                </button>

                <button
                  id="endpointsTab"
                  type="button"
                  class="flex-1 px-2 h-full text-sm font-semibold border-b-2 border-sky-500 text-sky-600 dark:text-sky-400 transition-colors"
                >
                  Bookmarks
                </button>

                <!-- HISTORY MENU (visible only while the History tab is active) -->
                <div
                  id="historyMenuWrap"
                  class="relative flex items-center shrink-0 invisible"
                >
                  <button
                    id="historyMenuButton"
                    type="button"
                    title="History options"
                    class="p-1 rounded text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 hover:text-cyan-600 dark:hover:text-cyan-400 transition"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="w-4 h-4"
                    >
                      <circle cx="12" cy="5" r="1"></circle>
                      <circle cx="12" cy="12" r="1"></circle>
                      <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                  </button>

                  <div
                    id="historyMenu"
                    class="hidden absolute top-full right-0 mt-1 w-40 z-30 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-2xl overflow-hidden"
                  >
                    <button
                      type="button"
                      data-history-action="invert-selection"
                      class="flex w-full items-center px-3 py-2 text-left text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition"
                    >
                      Invert Selection
                    </button>

                    <button
                      type="button"
                      data-history-action="select-all"
                      class="flex w-full items-center px-3 py-2 text-left text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition"
                    >
                      Select All
                    </button>

                    <button
                      type="button"
                      data-history-action="clear-selection"
                      class="flex w-full items-center px-3 py-2 text-left text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition"
                    >
                      Clear Selection
                    </button>

                    <div
                      class="border-t border-slate-200 dark:border-slate-800"
                    ></div>

                    <button
                      type="button"
                      data-history-action="delete-selected"
                      class="flex w-full items-center px-3 py-2 text-left text-xs text-rose-600 dark:text-rose-400 hover:bg-rose-500/10 transition"
                    >
                      Delete Selected
                    </button>
                  </div>
                </div>
              </div>
              <!-- SEARCH -->

              <div class="searchbar px-4 pt-3 pb-2 shrink-0">
                <input
                  type="text"
                  id="testSearchInput"
                  placeholder="Search endpoints..."
                  class="w-full h-8 px-3 rounded-md text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700/40 text-slate-800 dark:text-slate-100 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition"
                />
              </div>

              <!-- METHOD FILTER -->

              <div
                class="method-filter px-4 pb-3 flex items-center gap-3 shrink-0"
              >
                <label
                  class="text-[11px] font-semibold uppercase tracking-wider text-slate-500 whitespace-nowrap"
                >
                  Method
                </label>

                <div class="flex flex-wrap items-center gap-1.5">
                  <button
                    id="methodGET"
                    type="button"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-medium bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 transition hover:bg-emerald-500/25 hover:border-emerald-400 active:scale-95"
                  >
                    GET
                  </button>

                  <button
                    id="methodPOST"
                    type="button"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-medium bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/30 transition hover:bg-amber-500/25 hover:border-amber-400 active:scale-95"
                  >
                    POST
                  </button>

                  <button
                    id="methodPUT"
                    type="button"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-medium bg-sky-500/15 text-sky-600 dark:text-sky-400 border border-sky-500/30 transition hover:bg-sky-500/25 hover:border-sky-400 active:scale-95"
                  >
                    PUT
                  </button>

                  <button
                    id="methodDELETE"
                    type="button"
                    class="px-2.5 py-1 rounded-lg text-[11px] font-medium bg-red-500/15 text-red-600 dark:text-red-400 border border-red-500/30 transition hover:bg-red-500/25 hover:border-red-400 active:scale-95"
                  >
                    DELETE
                  </button>
                </div>
              </div>

              <!-- TIME + URL FILTERS -->

              <div
                class="filters flex gap-3 px-4 pb-4 border-b border-slate-200 dark:border-slate-800 shrink-0"
              >
                <div class="time-filter flex-1 flex flex-col gap-1.5">
                  <label
                    for="timeFilter"
                    class="text-[11px] font-semibold uppercase tracking-wide text-slate-500"
                  >
                    Time
                  </label>

                  <select
                    id="timeFilter"
                    name="time-filter"
                    class="w-full h-8 px-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700/40 text-sm text-slate-800 dark:text-slate-100 hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition cursor-pointer"
                  >
                    <option value="all">All Time</option>

                    <option value="today">Today</option>

                    <option value="week">This Week</option>
                  </select>
                </div>

                <div class="url-filter flex-1 flex flex-col gap-1.5">
                  <label
                    for="urlFilter"
                    class="text-[11px] font-semibold uppercase tracking-wide text-slate-500"
                  >
                    URL
                  </label>

                  <input
                    type="text"
                    id="urlFilter"
                    name="url-filter"
                    placeholder="Filter URL..."
                    class="w-full h-8 px-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700/40 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-500 hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition"
                  />
                </div>
              </div>

              <!-- ENDPOINT LIST -->

              <div
                id="testEndpointList"
                class="history-list flex-1 min-h-0 overflow-y-auto scrollbar scrollbar-thin scrollbar-thumb-slate-300 dark:scrollbar-thumb-slate-600 scrollbar-track-transparent hover:scrollbar-thumb-cyan-400 px-3 py-2 space-y-2"
              ></div>
            </div>
          </aside>

          <!-- QP PANEL -->

          <div
            class="w-16 min-w-16 h-full border-r border-slate-300 dark:border-slate-700/40 bg-slate-100 dark:bg-slate-900 flex flex-col shrink-0"
          >
            <!-- QP HEADER -->

            <div
              id="qpHeader"
              class="relative flex items-center justify-between gap-1 border-b border-slate-300 dark:border-slate-700 px-1.5 py-2 shrink-0"
            >
              <span class="text-xs font-semibold"> QP </span>

              <button
                id="qpMenuButton"
                type="button"
                title="QP options"
                class="p-0.5 rounded text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 hover:text-cyan-600 dark:hover:text-cyan-400 transition"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="w-4 h-4"
                >
                  <circle cx="12" cy="5" r="1"></circle>

                  <circle cx="12" cy="12" r="1"></circle>

                  <circle cx="12" cy="19" r="1"></circle>
                </svg>
              </button>

              <!-- QP MENU -->

              <div
                id="qpMenu"
                class="hidden absolute top-7 right-0 mt-1 w-36 z-30 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-2xl overflow-hidden"
              >
                <button
                  type="button"
                  data-qp-action="invert-selection"
                  class="flex w-full items-center px-3 py-2 text-left text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition"
                >
                  Invert Selection
                </button>

                <button
                  type="button"
                  data-qp-action="select-all"
                  class="flex w-full items-center px-3 py-2 text-left text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition"
                >
                  Select All
                </button>

                <button
                  type="button"
                  data-qp-action="clear-selection"
                  class="flex w-full items-center px-3 py-2 text-left text-xs text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition"
                >
                  Clear Selection
                </button>

                <div
                  class="border-t border-slate-200 dark:border-slate-800"
                ></div>

                <button
                  type="button"
                  data-qp-action="delete-selected"
                  class="flex w-full items-center px-3 py-2 text-left text-xs text-rose-600 dark:text-rose-400 hover:bg-rose-500/10 transition"
                >
                  Delete Selected
                </button>
              </div>
            </div>

            <!-- QP BUTTONS -->

            <div
              id="qpPanel"
              class="flex-1 min-h-0 overflow-y-auto p-1.5 space-y-1"
            ></div>
          </div>

          <!-- WORKSPACE -->

          <section
            class="workspace flex-1 min-w-[420px] flex flex-col min-h-0 bg-slate-100 dark:bg-[#06111F] p-4 space-y-4 overflow-y-auto scrollbar scrollbar-thin scrollbar-thumb-slate-300 dark:scrollbar-thumb-slate-600 scrollbar-track-transparent hover:scrollbar-thumb-cyan-400"
          >
            <!-- TOOLBAR -->

            <div
              class="toolbar flex items-center gap-2 px-3 py-2.5 bg-white dark:bg-slate-900 rounded-xl border border-slate-300 dark:border-slate-700/40 shrink-0"
            >
              <select
                id="Method"
                name="Method"
                class="h-8 w-24 shrink-0 rounded-lg border border-slate-300 dark:border-slate-700/40 bg-slate-100 dark:bg-slate-800 px-3 text-sm font-medium text-slate-800 dark:text-slate-100 hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition"
              >
                <option>GET</option>

                <option>POST</option>

                <option>PUT</option>

                <option>DELETE</option>
              </select>

              <!-- ADDRESS MODE TOGGLE -->

              <button
                id="addressModeToggle"
                type="button"
                title="Toggle address bar mode (combined / split)"
                class="h-8 w-8 shrink-0 flex items-center justify-center rounded-lg border border-slate-300 dark:border-slate-700/40 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-cyan-600 dark:hover:text-cyan-400 hover:border-cyan-500/50 transition"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="w-4 h-4"
                >
                  <path
                    d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                  ></path>

                  <path
                    d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                  ></path>
                </svg>
              </button>

              <!-- SPLIT ADDRESS -->

              <div id="addressSplit" class="flex flex-1 gap-2 min-w-0">
                <input
                  type="text"
                  id="URL-prefix"
                  placeholder="https://api.example.com"
                  class="flex-1 min-w-0 h-8 rounded-lg border border-slate-300 dark:border-slate-700/40 bg-slate-100 dark:bg-slate-800 px-3 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-500 hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition"
                />

                <input
                  type="text"
                  id="Endpoint-path"
                  placeholder="/users"
                  class="flex-1 min-w-0 h-8 rounded-lg border border-slate-300 dark:border-slate-700/40 bg-slate-100 dark:bg-slate-800 px-3 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-500 hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition"
                />
              </div>

              <!-- COMBINED ADDRESS -->

              <input
                type="text"
                id="URL-full"
                placeholder="https://api.example.com/users"
                class="hidden flex-1 min-w-0 h-8 rounded-lg border border-slate-300 dark:border-slate-700/40 bg-slate-100 dark:bg-slate-800 px-3 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-500 hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition"
              />

              <!-- RUN -->

              <button
                id="runRequest"
                type="button"
                class="h-8 shrink-0 px-4 flex items-center gap-1.5 rounded-lg bg-slate-900 text-white dark:bg-cyan-500 dark:text-slate-950 font-semibold text-sm transition hover:bg-slate-800 dark:hover:bg-cyan-400 active:scale-95 shadow-md shadow-slate-900/20 dark:shadow-cyan-500/20"
              >
                <span id="runIconContainer" class="flex items-center">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="w-4 h-4"
                  >
                    <polygon points="6 3 20 12 6 21 6 3"></polygon>
                  </svg>
                </span>

                <span id="runText">Run</span>
              </button>

              <!-- SAVE -->

              <div class="relative" id="saveDropdownContainer">
                <button
                  id="saveRequest"
                  type="button"
                  class="h-8 shrink-0 px-4 flex items-center gap-1.5 rounded-lg border border-emerald-500/40 bg-transparent text-emerald-600 dark:text-emerald-400 font-semibold text-sm transition hover:bg-emerald-500/10 active:scale-95"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="w-4 h-4"
                  >
                    <path
                      d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
                    ></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                  </svg>
                  Save
                  <svg
                    class="w-3 h-3 ml-1"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M6 9l6 6 6-6" />
                  </svg>
                </button>

                <div
                  id="saveMenu"
                  class="hidden absolute right-0 top-full mt-1 w-48 z-50 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-2xl overflow-hidden"
                >
                  <button
                    type="button"
                    id="btnUpdateQP"
                    class="flex w-full items-center px-4 py-2 text-left text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-emerald-600 dark:hover:text-emerald-400 transition"
                  >
                    Update Selected QP
                  </button>
                  <div
                    class="border-t border-slate-200 dark:border-slate-700"
                  ></div>
                  <button
                    type="button"
                    id="btnCreateQP"
                    class="flex w-full items-center px-4 py-2 text-left text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-emerald-600 dark:hover:text-emerald-400 transition"
                  >
                    Create New QP
                  </button>

                  <div
                    id="btnSaveCurrentCollectionSep"
                    class="border-t border-slate-200 dark:border-slate-700 hidden"
                  ></div>
                  <button
                    type="button"
                    id="btnSaveCurrentCollection"
                    class="hidden w-full items-center gap-2 px-4 py-2 text-left text-sm text-cyan-300 hover:bg-slate-800 hover:text-cyan-200 transition"
                  >
                    <svg
                      class="w-3.5 h-3.5 shrink-0"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                    Save to Current Collection
                  </button>
                  <div
                    class="border-t border-slate-200 dark:border-slate-700"
                  ></div>
                  <button
                    type="button"
                    id="btnAddToCollection"
                    class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-emerald-600 dark:hover:text-emerald-400 transition"
                  >
                    <svg
                      class="w-3.5 h-3.5 shrink-0"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <circle cx="12" cy="12" r="10" />
                      <path d="M12 8v8M8 12h8" />
                    </svg>
                    Add to Different Collection
                  </button>
                </div>
              </div>
            </div>

            <!-- METADATA -->

            <div class="metadata grid grid-cols-[2fr_1fr] gap-3 shrink-0">
              <!-- ANNOTATIONS -->

              <div
                class="annotations rounded-xl border border-slate-300 dark:border-slate-700/40 bg-white dark:bg-slate-900 p-3 space-y-2"
              >
                <label
                  for="annotations"
                  class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500"
                >
                  Annotations
                </label>

                <textarea
                  id="annotations"
                  name="annotations"
                  placeholder="Write notes about this endpoint..."
                  class="w-full h-16 resize-none rounded-lg border border-slate-300 dark:border-slate-700/40 bg-slate-100 dark:bg-slate-800 px-3 py-2 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-500 hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
                ></textarea>
              </div>

              <!-- TAGS -->

              <div
                class="tags rounded-xl border border-slate-300 dark:border-slate-700/40 bg-slate-50 dark:bg-slate-900 p-3 space-y-2"
              >
                <label
                  for="tagInput"
                  class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500"
                >
                  Tags
                </label>

                <div class="flex gap-2">
                  <input
                    type="text"
                    id="tagInput"
                    placeholder="Add tag..."
                    class="flex-1 h-8 rounded-lg border border-slate-300 dark:border-slate-700/40 bg-white dark:bg-slate-800 px-3 text-sm text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 hover:border-slate-400 dark:hover:border-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition"
                  />

                  <button
                    id="addTagButton"
                    type="button"
                    class="h-8 w-8 shrink-0 rounded-lg bg-slate-900 dark:bg-cyan-500 text-white dark:text-slate-950 font-bold transition hover:bg-slate-800 dark:hover:bg-cyan-400 active:scale-95"
                  >
                    +
                  </button>
                </div>

                <div id="endpointTags" class="flex flex-wrap gap-1.5">
                  <span class="text-xs text-slate-500">
                    No tags selected.
                  </span>
                </div>
              </div>
            </div>

            <!-- REQUEST / RESPONSE -->

            <div
              class="request-response grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1 min-h-0"
            >
              <!-- REQUEST PANEL -->

              <div
                id="requestBox"
                class="request flex flex-col min-h-0 h-full rounded-xl bg-white dark:bg-[#172334] border border-slate-300 dark:border-slate-700/40"
              >
                <!-- REQUEST HEADER -->

                <!-- REQUEST HEADER -->
                <div
                  class="panelheader flex items-center justify-between px-3 py-2.5 border-b border-slate-200 dark:border-slate-800 shrink-0"
                >
                  <!-- LEFT: TITLE -->
                  <h3 class="font-semibold text-sm shrink-0">Request</h3>

                  <!-- CENTER: REQUEST TABS -->
                  <div class="panel-tabs flex items-center gap-2 mx-auto">
                    <button
                      id="requestHeadersTab"
                      type="button"
                      class="reqb px-3 py-1.5 rounded-lg bg-cyan-500 text-slate-950 text-xs font-semibold transition hover:bg-cyan-400 active:scale-95"
                    >
                      Headers
                    </button>

                    <button
                      id="requestBodyTab"
                      type="button"
                      class="reqb px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700 transition active:scale-95"
                    >
                      Body
                    </button>
                  </div>

                  <!-- RIGHT: ACTION BUTTONS -->
                  <div class="flex items-center gap-1 shrink-0">
                    <!-- Fullscreen -->
                    <button
                      id="requestFullscreen"
                      type="button"
                      class="rounded-md p-1.5 text-slate-500 dark:text-slate-400 transition hover:bg-slate-200 dark:hover:bg-slate-700 hover:text-cyan-600 dark:hover:text-cyan-400"
                      title="Fullscreen"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="w-4 h-4"
                      >
                        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                        <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                        <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                      </svg>
                    </button>

                    <!-- Reset Size -->
                    <button
                      id="requestReset"
                      type="button"
                      class="rounded-md p-1.5 text-slate-500 dark:text-slate-400 transition hover:bg-slate-200 dark:hover:bg-slate-700 hover:text-yellow-600 dark:hover:text-yellow-400"
                      title="Reset Size"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="w-4 h-4"
                      >
                        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                        <path d="M3 3v5h5"></path>
                      </svg>
                    </button>
                  </div>
                </div>

                <!-- REQUEST EDITOR -->

                <div
                  class="content flex-1 min-h-0 flex p-3 bg-slate-50 dark:bg-slate-950/40"
                >
                  <textarea
                    id="requestContent"
                    class="w-full h-full resize-none rounded-lg border border-slate-300 dark:border-slate-700/40 bg-white dark:bg-slate-950 px-4 py-3 text-sm font-mono leading-6 text-slate-800 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-600 hover:border-slate-400 dark:hover:border-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
                    spellcheck="false"
                    placeholder='{
"Authorization": "Bearer token"
}'
                  ></textarea>
                </div>
              </div>

              <!-- RESPONSE PANEL -->

              <div
                id="responseBox"
                class="response flex flex-col min-h-0 h-full rounded-xl bg-white dark:bg-[#172334] border border-slate-300 dark:border-slate-700/40"
              >
                <!-- RESPONSE HEADER -->

                <!-- RESPONSE HEADER -->
                <div
                  class="panelheader flex items-center justify-between px-3 py-2.5 border-b border-slate-200 dark:border-slate-800 shrink-0"
                >
                  <!-- LEFT: TITLE -->
                  <h3 class="font-semibold text-sm shrink-0">Response</h3>

                  <!-- CENTER: RESPONSE TABS -->
                  <div class="panel-tabs flex items-center gap-2 mx-auto">
                    <button
                      id="responseHeadersTab"
                      type="button"
                      class="respb px-3 py-1.5 rounded-lg bg-cyan-500 text-slate-950 text-xs font-semibold transition hover:bg-cyan-400 active:scale-95"
                    >
                      Headers
                    </button>

                    <button
                      id="responseBodyTab"
                      type="button"
                      class="respb px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-medium hover:bg-slate-700 transition active:scale-95"
                    >
                      Body
                    </button>
                  </div>

                  <!-- RIGHT: ACTION BUTTONS -->
                  <div class="flex items-center gap-1 shrink-0">
                    <!-- Fullscreen -->
                    <button
                      id="responseFullscreen"
                      type="button"
                      class="rounded-md p-1.5 text-slate-500 dark:text-slate-400 transition hover:bg-slate-200 dark:hover:bg-slate-700 hover:text-cyan-600 dark:hover:text-cyan-400"
                      title="Fullscreen"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="w-4 h-4"
                      >
                        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                        <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                        <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                      </svg>
                    </button>

                    <!-- Reset Size -->
                    <button
                      id="responseReset"
                      type="button"
                      class="rounded-md p-1.5 text-slate-500 dark:text-slate-400 transition hover:bg-slate-200 dark:hover:bg-slate-700 hover:text-yellow-600 dark:hover:text-yellow-400"
                      title="Reset Size"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        class="w-4 h-4"
                      >
                        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
                        <path d="M3 3v5h5"></path>
                      </svg>
                    </button>
                  </div>
                </div>
                <!-- RESPONSE EDITOR -->

                <div
                  class="content flex-1 min-h-0 flex p-3 bg-slate-50 dark:bg-slate-950/40"
                >
                  <textarea
                    id="responseContent"
                    class="w-full h-full resize-none rounded-lg border border-slate-300 dark:border-slate-700/40 bg-white dark:bg-slate-950 px-4 py-3 text-sm font-mono leading-6 text-slate-800 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-600 hover:border-slate-400 dark:hover:border-slate-600 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
                    spellcheck="false"
                    placeholder='{
"status": "success",
"data": {}
}'
                  ></textarea>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- NAVIGATION SCRIPT -->

    <script src="../api/edms-api.js"></script>

    <script src="../js/nav-bar.js"></script>
    <script src="../js/components/pending-changes.js"></script>

    <script src="../js/testview/testview.js"></script>
    <script src="../js/theme.js"></script>

    <!-- ADD TO COLLECTION MODAL -->
    <dialog
      id="addToCollectionModal"
      class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700/60 rounded-xl shadow-2xl p-0 backdrop:bg-black/60 backdrop:backdrop-blur-sm max-w-sm w-full outline-none"
    >
      <div class="flex flex-col">
        <!-- MODAL HEADER -->
        <div
          class="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-700/60 bg-slate-100 dark:bg-slate-800/50"
        >
          <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-200">
            Add to Collection
          </h3>

          <button
            type="button"
            id="closeAddToCollectionModal"
            class="text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition"
            aria-label="Close modal"
          >
            <svg
              class="w-4 h-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>

        <!-- MODAL BODY -->
        <div class="p-4 flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label
              for="collectionSelect"
              class="text-xs font-medium text-slate-500 dark:text-slate-400"
            >
              Select Collection
            </label>

            <select
              id="collectionSelect"
              class="w-full h-9 px-3 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700/40 text-sm text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition"
            >
              <!-- Populated dynamically -->
            </select>
          </div>
        </div>

        <!-- MODAL FOOTER -->
        <div
          class="flex items-center justify-end gap-2 px-4 py-3 border-t border-slate-200 dark:border-slate-700/60 bg-slate-50 dark:bg-slate-800/30"
        >
          <button
            type="button"
            id="cancelAddToCollectionBtn"
            class="px-3 py-1.5 text-xs font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition"
          >
            Cancel
          </button>

          <button
            type="button"
            id="confirmAddToCollectionBtn"
            class="px-4 py-1.5 rounded-lg bg-slate-900 text-white dark:bg-cyan-500 dark:text-slate-950 font-semibold text-xs transition hover:bg-slate-800 dark:hover:bg-cyan-400 active:scale-95 shadow-md shadow-slate-900/20 dark:shadow-cyan-500/20"
          >
            Add
          </button>
        </div>
      </div>
    </dialog>
  </body>
</html>
