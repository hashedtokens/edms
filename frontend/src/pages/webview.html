<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDMS Web View</title>
    <link rel="icon" type="image/png" href="../images/logo.png">

    <link href="../styles/output.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../js/web_view/edit-webview-frontpage.css">

    <!-- Flash-prevention: set theme class before first paint -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.toggle('dark', theme === 'dark');
        })();
    </script>
</head>


<body class="min-h-screen overflow-hidden bg-slate-100 dark:bg-slate-950
           font-[Inter] text-slate-800 dark:text-slate-100 transition-colors" data-current-page="web">


    <!-- =========================================================
         PAGE
    ========================================================== -->

    <div class="h-screen p-3">
        <div class="mx-auto flex h-full max-w-screen-2xl
                   flex-col overflow-hidden rounded-xl
                   border border-slate-300 dark:border-slate-800
                   bg-slate-100 dark:bg-slate-900">


            <!-- =====================================================
                 HEADER
            ====================================================== -->

            <header class="flex shrink-0 flex-wrap items-center justify-between gap-3
               border-b border-slate-200 dark:border-slate-700/40
               bg-slate-100 dark:bg-[#162235] px-3 py-2 sm:px-4">

                <!-- Logo / Title -->
                <a href="./index.html" class="brand group flex shrink-0 items-center gap-2.5">
                    <img src="../images/logo.png" alt="HashedTokens" class="h-8 w-auto object-contain"> <span
                        class="text-lg font-bold tracking-tight text-slate-800 dark:text-white">
                        HashedTokens EDMS
                    </span>
                </a>

                <!-- Header actions: nav + theme toggle -->
                <div class="flex items-center gap-2">

                    <!-- Navigation -->
                    <nav class="navbar flex items-center gap-1 rounded bg-slate-100 p-1 dark:bg-transparent">

                        <!-- Home -->
                        <button id="homenav" data-target="./index.html" data-page="home" class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500
                       transition hover:bg-slate-200 hover:text-slate-900
                       dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white">
                            Home
                        </button>

                        <!-- Test View -->
                        <button id="testnav" data-target="./testview.html" data-page="test" class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500
                       transition hover:bg-slate-200 hover:text-slate-900
                       dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white">
                            Test View
                        </button>

                        <!-- Collection View -->
                        <button id="collectionnav" data-target="./collection_view.html" data-page="collection" class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500
                       transition hover:bg-slate-200 hover:text-slate-900
                       dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white">
                            Collections
                        </button>


                        <!-- Repo View -->
                        <button id="reponav" data-target="./repoview.html" data-page="repo" class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500
                       transition hover:bg-slate-200 hover:text-slate-900
                       dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white">
                            Repo View
                        </button>

                        <!-- Web View (active) -->
                        <button id="webnav" data-target="./webview.html" data-page="web" class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-white
                       bg-slate-900 dark:bg-cyan-500
                       shadow-lg shadow-slate-900/30 dark:shadow-cyan-500/30">
                            Web View
                        </button>
                        <button id="importexportnav" data-target="./import_export.html" data-page="import_export" class="nav-button rounded px-3.5 py-1.5 text-sm font-medium text-slate-500
                     transition hover:bg-slate-200 hover:text-slate-900
                     dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-white">
                            Import / Export
                        </button>
                    </nav>

                    <!-- Theme toggle -->
                    <button id="themeToggle" type="button" title="Toggle theme" class="flex h-8 w-8 items-center justify-center rounded-full
                   bg-slate-200 dark:bg-slate-700
                   text-slate-700 dark:text-slate-200
                   border border-slate-300 dark:border-slate-600
                   transition
                   hover:bg-slate-300 dark:hover:bg-slate-600
                   hover:text-slate-900 dark:hover:text-white
                   hover:border-cyan-400/50">

                        <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="hidden h-4 w-4">
                            <circle cx="12" cy="12" r="4"></circle>
                            <path
                                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
                            </path>
                        </svg>

                        <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="h-4 w-4">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
                        </svg>
                    </button>
                </div>
            </header>


            <!-- =====================================================
                 TOOLBAR
            ====================================================== -->

            <section class="flex shrink-0 flex-wrap items-center
                       gap-2 border-b border-slate-200 dark:border-slate-800
                       bg-slate-50 dark:bg-slate-900/80 px-3 py-2.5">

                <!-- Search -->

                <div class="relative min-w-[180px]
                           flex-1 sm:max-w-xs">

                    <svg class="pointer-events-none absolute left-2.5
                               top-1/2 h-4 w-4
                               -translate-y-1/2 text-slate-400 dark:text-slate-500" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.8">
                        <circle cx="11" cy="11" r="7" />
                        <path d="m20 20-3.5-3.5" />
                    </svg>

                    <input id="webSearch" type="search" placeholder="Search web views..." class="h-8 w-full rounded-md
                               border border-slate-300 dark:border-slate-700
                               bg-white dark:bg-slate-800/80 pl-8 pr-3
                               text-xs text-slate-800 dark:text-slate-100 outline-none
                               transition
                               focus:border-cyan-500
                               focus:ring-1
                               focus:ring-cyan-500/30">

                </div>


                <!-- CRUD -->

                <select id="crudFilter" class="h-8 rounded-md
                           border border-slate-300 dark:border-slate-800
                           bg-white dark:bg-slate-800 px-2.5 text-xs
                           text-slate-800 dark:text-slate-100
                           outline-none
                           focus:border-cyan-500">
                    <option value="all">CRUD: All</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="PATCH">PATCH</option>
                    <option value="DELETE">DELETE</option>
                </select>


                <!-- Reset -->

                <button id="resetFilters" type="button" class="inline-flex h-8 items-center
                           gap-1.5 rounded-md
                           border border-slate-300 dark:border-slate-700
                           bg-white dark:bg-slate-800 px-2.5
                           text-xs text-slate-700 dark:text-slate-300
                           transition
                           hover:bg-slate-200 dark:hover:bg-slate-700">

                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M3 12a9 9 0 0 1 15.3-6.4L21 8" />
                        <path d="M21 3v5h-5" />
                        <path d="M21 12a9 9 0 0 1-15.3 6.4L3 16" />
                        <path d="M3 21v-5h5" />
                    </svg>

                    Reset

                </button>


                <!-- New -->

                <button id="createWebBtn" type="button" class="inline-flex h-8 items-center
                           gap-1.5 rounded-md
                           bg-slate-900 dark:bg-sky-600 px-2.5
                           text-xs font-medium text-white
                           transition hover:bg-slate-800 dark:hover:bg-sky-500">

                    <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M12 5v14" />
                        <path d="M5 12h14" />
                    </svg>

                    New

                </button>

            </section>


            <!-- =====================================================
                 SELECTED FOLDERS BAR
            ====================================================== -->

            <div id="selectionBar" class="hidden shrink-0 items-center
                       gap-3 border-b
                       border-cyan-500/10
                       bg-cyan-500/[0.035]
                       px-3 py-2">

                <span id="selectedWebCount" class="rounded-md bg-cyan-500/10
                           px-2 py-1 text-xs font-medium
                           text-cyan-700 dark:text-cyan-300">
                    0 selected
                </span>


                <div id="selectedWebList" class="flex min-w-0 flex-1
                           items-center gap-1.5
                           overflow-x-auto"></div>


                <button id="combineWebSelection" type="button"
                    class="hidden shrink-0 rounded-md border border-cyan-500/40 bg-cyan-500/10 px-2.5 py-1 text-xs font-medium text-cyan-700 dark:text-cyan-300 transition hover:bg-cyan-500/20">
                    Combine
                </button>

                <button id="deleteWebSelection" type="button"
                    class="hidden shrink-0 rounded-md border border-rose-500/40 bg-rose-500/10 px-2.5 py-1 text-xs font-medium text-rose-600 dark:text-rose-300 transition hover:bg-rose-500/20">
                    Delete Selected
                </button>

                <button id="clearWebSelection" type="button" class="shrink-0 text-xs
                           text-slate-500 dark:text-slate-400
                           hover:text-slate-900 dark:hover:text-white">
                    Clear
                </button>

            </div>


            <!-- =====================================================
                 MAIN WORKSPACE
            ====================================================== -->

            <div class="flex min-h-0 flex-1 overflow-hidden">


                <!-- =================================================
                     FILTER SIDEBAR
                ================================================== -->

                <aside id="filterSidebar" class="relative flex w-64 shrink-0
                           flex-col overflow-hidden
                           border-r border-slate-200 dark:border-slate-800
                           bg-slate-50 dark:bg-slate-900
                           transition-all duration-200">

                    <div class="flex shrink-0 items-center
                               justify-between
                               border-b border-slate-200 dark:border-slate-800
                               px-3 py-2.5">

                        <span id="sidebarTitle" class="text-xs font-semibold
                                   text-slate-800 dark:text-slate-200">
                            Filters
                        </span>


                        <button id="sidebarToggle" type="button" title="Collapse sidebar" class="rounded-md p-1
                                   text-slate-500
                                   transition
                                   hover:bg-slate-200 dark:hover:bg-slate-800
                                   hover:text-slate-900 dark:hover:text-white">

                            <svg id="sidebarToggleIcon" class="h-4 w-4" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="1.8">
                                <path d="m15 18-6-6 6-6" />
                            </svg>

                        </button>

                    </div>


                    <div id="sidebarContent"
                        class="min-h-0 flex-1 overflow-y-auto p-3 scrollbar scrollbar-thin scrollbar-thumb-slate-300 dark:scrollbar-thumb-slate-700 scrollbar-track-transparent">
                        <!-- Active Row Details (Tabs) -->
                        <section id="sidebarActiveSection"
                            class="mb-5 hidden bg-slate-100 dark:bg-slate-800/40 p-2 rounded-md border border-slate-300 dark:border-slate-700/50">
                            <!-- Tabs -->
                            <div class="flex mb-3 rounded bg-slate-200 dark:bg-slate-800 p-0.5 shrink-0">
                                <button id="activeTabRepo"
                                    class="flex-1 rounded-sm px-2 py-1.5 text-[10px] font-medium bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition">Web
                                    Details</button>
                                <button id="activeTabEqp"
                                    class="flex-1 rounded-sm px-2 py-1.5 text-[10px] font-medium text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 transition">EQP
                                    Details</button>
                            </div>

                            <!-- Repo Details Content -->
                            <div id="activeContentRepo" class="space-y-4"></div>

                            <!-- EQP Details Content -->
                            <div id="activeContentEqp" class="space-y-4 hidden"></div>
                        </section>

                        <!-- Stats -->
                        <section class="mb-5">
                            <div class="mb-2 border-b border-slate-200 dark:border-slate-800 pb-1.5">
                                <h3 class="text-xs font-semibold text-slate-700 dark:text-slate-300">Stats</h3>
                            </div>
                            <div class="space-y-2">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs text-slate-500">Web Views</span>
                                    <span id="webStat"
                                        class="text-xs font-medium text-slate-800 dark:text-slate-300">0</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="text-xs text-slate-500">Tags</span>
                                    <span id="tagStat"
                                        class="text-xs font-medium text-slate-800 dark:text-slate-300">0</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span class="text-xs text-slate-500">Segments</span>
                                    <span id="segmentStat"
                                        class="text-xs font-medium text-slate-800 dark:text-slate-300">0</span>
                                </div>
                            </div>
                        </section>

                        <!-- Repo Tags -->
                        <section class="mb-5">
                            <div class="mb-2 border-b border-slate-200 dark:border-slate-800 pb-1.5">
                                <h3 class="text-xs font-semibold text-slate-700 dark:text-slate-300">Repo Tags</h3>
                            </div>
                            <div id="tagsContainer" class="flex flex-col gap-1.5"></div>
                        </section>

                        <!-- Segments -->
                        <section class="mb-5">
                            <div class="mb-2 border-b border-slate-200 dark:border-slate-800 pb-1.5">
                                <h3 class="text-xs font-semibold text-slate-700 dark:text-slate-300">Segments</h3>
                            </div>
                            <div id="segmentsContainer" class="flex flex-col gap-1.5"></div>
                        </section>
                    </div>

                </aside>


                <!-- =================================================
                     TABLE
                ================================================== -->

                <main class="min-w-0 flex-1 overflow-hidden
                           bg-white dark:bg-slate-950/20">

                    <div class="flex h-full min-w-0 flex-col">


                        <div id="tableScroll" class="min-h-0 flex-1
                                   overflow-auto
                                   scrollbar scrollbar-thin
                                   scrollbar-thumb-slate-300
                                   dark:scrollbar-thumb-slate-700
                                   scrollbar-track-transparent
                                   hover:scrollbar-thumb-cyan-500/60">

                            <table class="w-full min-w-[1250px]
                                       text-xs">

                                <thead class="sticky top-0 z-20
                                           border-b border-slate-200 dark:border-slate-800
                                           bg-slate-100 dark:bg-slate-900/98
                                           backdrop-blur">

                                    <tr class="text-left
                                               text-slate-500 dark:text-slate-400">

                                        <th class="w-10 px-2 py-2.5">
                                            <input id="selectAllWebs" type="checkbox" class="h-3.5 w-3.5
                                                       accent-slate-900 dark:accent-cyan-400" title="Select all">
                                        </th>

                                        <!-- Group 1 -->
                                        <th class="px-2 py-2.5 whitespace-nowrap">Folder Name</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap">Annotation</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap">Tags</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap">Date Created</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap">Size</th>

                                        <!-- Group 2 -->
                                        <th class="w-12 px-1 py-2.5 text-center border-l border-slate-300 dark:border-slate-700"
                                            title="GET endpoints">GET</th>
                                        <th class="w-12 px-1 py-2.5 text-center" title="POST endpoints">POST</th>
                                        <th class="w-12 px-1 py-2.5 text-center" title="PUT endpoints">PUT</th>
                                        <th class="w-12 px-1 py-2.5 text-center" title="PATCH endpoints">PATCH</th>
                                        <th class="w-12 px-1 py-2.5 text-center" title="DELETE endpoints">DEL</th>

                                        <th class="px-2 py-2.5 whitespace-nowrap">EID Count</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap">Segments</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap">EQP Tags</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap">QP Count</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap">Index Lists</th>

                                        <th class="px-2 py-2.5 whitespace-nowrap text-center">Preview</th>
                                        <th class="px-2 py-2.5 whitespace-nowrap text-center">Action</th>

                                    </tr>

                                </thead>


                                <tbody id="webTableBody"></tbody>

                            </table>

                        </div>


                        <!-- Footer -->

                        <footer class="flex shrink-0
                                   flex-wrap items-center
                                   justify-between gap-3
                                   border-t border-slate-200 dark:border-slate-800
                                   bg-slate-100 dark:bg-slate-900
                                   px-3 py-2.5">

                            <p class="text-[11px] text-slate-500">

                                Showing

                                <span id="webRangeStart" class="font-medium text-slate-800 dark:text-slate-300">0</span>
                                –
                                <span id="webRangeEnd" class="font-medium text-slate-800 dark:text-slate-300">0</span>
                                of
                                <span id="webTotal" class="font-medium text-slate-800 dark:text-slate-300">0</span>
                                web views

                            </p>


                            <div class="flex items-center gap-1">

                                <button id="webPrev" type="button" class="min-w-7 rounded-md
                                           border border-slate-500 dark:border-slate-700
                                           px-2 py-1 text-[11px]
                                           text-slate-500 dark:text-slate-400
                                           transition
                                           hover:bg-slate-200 dark:hover:bg-slate-800
                                           hover:text-slate-900 dark:hover:text-white
                                           disabled:cursor-not-allowed
                                           disabled:opacity-200">
                                    ‹
                                </button>


                                <div id="webPagination" class="flex items-center gap-1"></div>


                                <button id="webNext" type="button" class="min-w-7 rounded-md
                                           border border-slate-500 dark:border-slate-700
                                           px-2 py-1 text-[11px]
                                           text-slate-500 dark:text-slate-400
                                           transition
                                           hover:bg-slate-200 dark:hover:bg-slate-800
                                           hover:text-slate-900 dark:hover:text-white
                                           disabled:cursor-not-allowed
                                           disabled:opacity-200">
                                    ›
                                </button>

                            </div>

                        </footer>

                    </div>

                </main>

            </div>

        </div>

    </div>


    <!-- =========================================================
         CONTEXT MENU
    ========================================================== -->

    <div id="contextMenu"
        class="hidden fixed z-[1000] w-56 overflow-hidden rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 shadow-2xl shadow-slate-400/30 dark:shadow-black/50">
    </div>


    <!-- =========================================================
         MODAL
    ========================================================== -->

    <div id="modalBackdrop" class="fixed inset-0 z-[2000]
               hidden items-center justify-center
               bg-slate-900/40 dark:bg-slate-950/70 p-4
               backdrop-blur-sm">

        <div id="modalContent" class="max-h-[85vh] w-full max-w-2xl
                   overflow-y-auto rounded-xl
                   border border-slate-300 dark:border-slate-700
                   bg-white dark:bg-slate-900 p-5 shadow-2xl
                   scrollbar scrollbar-thin
                   scrollbar-thumb-slate-300 dark:scrollbar-thumb-slate-700"></div>

    </div>


    <script src="../api/edms-api.js"></script>
    <script type="module" src="../js/web_view/edit-webview-frontpage.js"></script>
    <script src="../js/web_view/webview.js"></script>
    <script src="../js/web_view/webview-preview.js"></script>
    <script src="../js/web_view/rmbwv.js"></script>
    <script src="../js/nav-bar.js"></script>
    <script src="../js/theme.js"></script>

</body>

</html>
