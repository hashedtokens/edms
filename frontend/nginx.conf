server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location = / {
    return 301 $scheme://$http_host/pages/index.html;
}

    location / {
        try_files $uri $uri/ =404;
    }
    # Frontend API helper JS — serve as a static file
    location = /api/edms-api.js {
        try_files $uri =404;
    }


    # Currently unused — the frontend's own JS calls the backend directly
    # via a hardcoded http://localhost:3000 (see testview.js's API_BASE),
    # not through this proxy. Kept accurate rather than pointing at a
    # container name ("edms-backend-mathew") that doesn't exist in the
    # docker-compose setup, in case something starts using it later —
    # "webserver" is the actual service name docker-compose's internal
    # DNS resolves.
    location /api/ {
        proxy_pass http://webserver:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}