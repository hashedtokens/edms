<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 305' width='800' height='305'><title>webserver to compute IPC</title><rect width='800' height='305' rx='14' fill='#ffffff'/><text x='400' y='32' text-anchor='middle' font-size='18' font-weight='700' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>One task = one short-lived process (like child_process.spawn)</text><rect x='40' y='90' width='200' height='80' rx='10' fill='#f5f3ff' stroke='#9333ea' stroke-width='2'/><text x='140.0' y='126.0' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>webserver</text><text x='140.0' y='144.0' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>parent process</text><g opacity='0'><animate attributeName='opacity' dur='7s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.0571;0.8000'/><rect x='540' y='90' width='220' height='80' rx='10' fill='#fff7ed' stroke='#ea580c' stroke-width='2'/><text x='650.0' y='126.0' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>edms-child</text><text x='650.0' y='144.0' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>new process per task</text></g><path d='M240,115 L540,115' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M540,150 L240,150' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><text x='390' y='106' text-anchor='middle' font-size='12' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>stdin: one JSON line</text><text x='390' y='172' text-anchor='middle' font-size='12' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>HTTP POST 127.0.0.1:PORT/internal/callback</text><g opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.0857;0.2286'/><circle r='8' fill='#ea580c' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#ea580c' font-family='Segoe UI, Helvetica, Arial, sans-serif'>{task, payload}</text><animateMotion dur='7.0s' repeatCount='indefinite' path='M240,115 L540,115' keyPoints='0;0;1;1' keyTimes='0;0.0857;0.2286;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.6000;0.7714'/><circle r='8' fill='#16a34a' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#16a34a' font-family='Segoe UI, Helvetica, Arial, sans-serif'>{task, result, success}</text><animateMotion dur='7.0s' repeatCount='indefinite' path='M540,150 L240,150' keyPoints='0;0;1;1' keyTimes='0;0.6000;0.7714;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='7s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.2286;0.6000'/><circle cx='650' cy='215' r='14' fill='none' stroke='#ea580c' stroke-width='4' stroke-dasharray='60 30'><animateTransform attributeName='transform' type='rotate' from='0 650 215' to='360 650 215' dur='0.9s' repeatCount='indefinite'/></circle></g><text x='400' y='280' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>1. spawn('edms-child')<animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.0000;0.0857'/></text><text x='400' y='280' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>2. write the task JSON to the child's stdin<animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.0857;0.2286'/></text><text x='400' y='280' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>3. child runs dispatch(task) → history_ops_inner(payload)<animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.2286;0.6000'/></text><text x='400' y='280' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>4. child POSTs the result back to the parent<animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.6000;0.7714'/></text><text x='400' y='280' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>5. child exits; webserver's callback.rs handles the result<animate attributeName='opacity' dur='7.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.7714;1.0000'/></text></svg>