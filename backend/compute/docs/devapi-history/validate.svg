<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 455' width='760' height='455'><title>validation gates</title><rect width='760' height='455' rx='14' fill='#ffffff'/><text x='380' y='30' text-anchor='middle' font-size='18' font-weight='700' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>parse_history_request: mandatory first, then optional</text><rect x='210' y='60' width='300' height='40' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='2'/><text x='360' y='85' text-anchor='middle' font-size='14' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>is it a JSON object?</text><text x='200' y='85' text-anchor='end' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>shape</text><text x='640' y='85' text-anchor='middle' font-size='12' fill='#dc2626' font-family='Segoe UI, Helvetica, Arial, sans-serif'>no → 4000</text><path d='M510,80 L585,80' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><rect x='210' y='118' width='300' height='40' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='2'/><text x='360' y='143' text-anchor='middle' font-size='14' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>ops present and == 'test'?</text><text x='200' y='143' text-anchor='end' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>mandatory</text><text x='640' y='143' text-anchor='middle' font-size='12' fill='#dc2626' font-family='Segoe UI, Helvetica, Arial, sans-serif'>no → 4001 / 4002</text><path d='M510,138 L585,138' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><rect x='210' y='176' width='300' height='40' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='2'/><text x='360' y='201' text-anchor='middle' font-size='14' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>endpoint_str present, http(s)?</text><text x='200' y='201' text-anchor='end' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>mandatory</text><text x='640' y='201' text-anchor='middle' font-size='12' fill='#dc2626' font-family='Segoe UI, Helvetica, Arial, sans-serif'>no → 4001 / 4003</text><path d='M510,196 L585,196' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><rect x='210' y='234' width='300' height='40' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='2'/><text x='360' y='259' text-anchor='middle' font-size='14' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>method present, one of 6?</text><text x='200' y='259' text-anchor='end' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>mandatory</text><text x='640' y='259' text-anchor='middle' font-size='12' fill='#dc2626' font-family='Segoe UI, Helvetica, Arial, sans-serif'>no → 4001 / 4003</text><path d='M510,254 L585,254' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><rect x='210' y='292' width='300' height='40' rx='8' fill='#f9fafb' stroke='#d1d5db' stroke-width='2'/><text x='360' y='317' text-anchor='middle' font-size='14' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>headers / timeout / flag types ok?</text><text x='200' y='317' text-anchor='end' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>optional</text><text x='640' y='317' text-anchor='middle' font-size='12' fill='#dc2626' font-family='Segoe UI, Helvetica, Arial, sans-serif'>no → 4003</text><path d='M510,312 L585,312' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><rect x='260' y='350' width='200' height='50' rx='10' fill='#f0fdf4' stroke='#16a34a' stroke-width='2'/><text x='360.0' y='371.0' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>call the endpoint</text><text x='360.0' y='389.0' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>call_endpoint()</text><path d='M360,50 L360,350' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><g opacity='0'><animate attributeName='opacity' dur='10.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.0000;0.4500'/><circle r='8' fill='#16a34a' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#16a34a' font-family='Segoe UI, Helvetica, Arial, sans-serif'>good payload</text><animateMotion dur='10.0s' repeatCount='indefinite' path='M360,46 L360,375' keyPoints='0;0;1;1' keyTimes='0;0.0000;0.4500;1' calcMode='linear'/></g><text x='380' y='435' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>{ ops:'test', endpoint_str:'http://api/users', method:'post' } → passes every gate<animate attributeName='opacity' dur='10.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.0000;0.5000'/></text><g opacity='0'><animate attributeName='opacity' dur='10.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.5000;0.8500'/><circle r='8' fill='#dc2626' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#dc2626' font-family='Segoe UI, Helvetica, Arial, sans-serif'>bad payload</text><animateMotion dur='10.0s' repeatCount='indefinite' path='M360,46 L360,196 L572,196' keyPoints='0;0;1;1' keyTimes='0;0.5000;0.8500;1' calcMode='linear'/></g><text x='380' y='435' text-anchor='middle' font-size='13' font-weight='600' fill='#dc2626' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>{ ops:'test', method:'GET' } → no endpoint_str → 4001, stops here<animate attributeName='opacity' dur='10.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.5000;0.9999'/></text></svg>