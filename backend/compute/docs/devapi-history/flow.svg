<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 910 425' width='910' height='425'><title>EDMS dev API history flow</title><rect width='910' height='425' rx='14' fill='#ffffff'/><text x='450' y='32' text-anchor='middle' font-size='18' font-weight='700' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>POST /hashedtokens/edms/api/history/  (ops = test)</text><path d='M200,75 L370,75' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M370,95 L200,95' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M530,75 L700,75' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M775,120 L775,290' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M805,290 L805,120' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M720,120 L530,300' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M700,100 L530,100' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M380,120 L205,295' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M370,112 L200,112' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><path d='M180,290 L355,120' fill='none' stroke='#d1d5db' stroke-width='2' stroke-dasharray='5 5'/><rect x='40' y='55' width='160' height='65' rx='10' fill='#eff6ff' stroke='#2563eb' stroke-width='2'/><text x='120.0' y='83.5' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Backend dev</text><text x='120.0' y='101.5' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>curl / your Node app</text><rect x='370' y='55' width='160' height='65' rx='10' fill='#f5f3ff' stroke='#9333ea' stroke-width='2'/><text x='450.0' y='83.5' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>webserver</text><text x='450.0' y='101.5' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Rust Axum (Mathew)</text><rect x='700' y='55' width='170' height='65' rx='10' fill='#fff7ed' stroke='#ea580c' stroke-width='2'/><text x='785.0' y='83.5' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>compute</text><text x='785.0' y='101.5' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>edms-child (Hemang)</text><rect x='700' y='290' width='170' height='65' rx='10' fill='#f0fdfa' stroke='#0d9488' stroke-width='2'/><text x='785.0' y='318.5' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>Target API</text><text x='785.0' y='336.5' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>the endpoint being tested</text><rect x='370' y='290' width='160' height='65' rx='10' fill='#f0fdf4' stroke='#16a34a' stroke-width='2'/><text x='450.0' y='318.5' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>SQLite + files</text><text x='450.0' y='336.5' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>history, EQP json</text><rect x='40' y='290' width='160' height='65' rx='10' fill='#eff6ff' stroke='#2563eb' stroke-width='2'/><text x='120.0' y='318.5' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' font-family='Segoe UI, Helvetica, Arial, sans-serif'>EDMS UI</text><text x='120.0' y='336.5' text-anchor='middle' font-size='11' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>browser</text><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.0000;0.1111'/><circle r='8' fill='#2563eb' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#2563eb' font-family='Segoe UI, Helvetica, Arial, sans-serif'>POST</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M200,75 L370,75' keyPoints='0;0;1;1' keyTimes='0;0.0000;0.1111;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.1111;0.1889'/><circle r='8' fill='#6b7280' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#6b7280' font-family='Segoe UI, Helvetica, Arial, sans-serif'>202</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M370,95 L200,95' keyPoints='0;0;1;1' keyTimes='0;0.1111;0.1889;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.1889;0.3000'/><circle r='8' fill='#ea580c' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#ea580c' font-family='Segoe UI, Helvetica, Arial, sans-serif'>task</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M530,75 L700,75' keyPoints='0;0;1;1' keyTimes='0;0.1889;0.3000;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.3000;0.3889'/><circle r='8' fill='#ea580c' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#ea580c' font-family='Segoe UI, Helvetica, Arial, sans-serif'>HTTP</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M775,120 L775,290' keyPoints='0;0;1;1' keyTimes='0;0.3000;0.3889;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.3889;0.4778'/><circle r='8' fill='#0d9488' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#0d9488' font-family='Segoe UI, Helvetica, Arial, sans-serif'>resp</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M805,290 L805,120' keyPoints='0;0;1;1' keyTimes='0;0.3889;0.4778;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.4778;0.5889'/><circle r='8' fill='#16a34a' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#16a34a' font-family='Segoe UI, Helvetica, Arial, sans-serif'>W</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M720,120 L530,300' keyPoints='0;0;1;1' keyTimes='0;0.4778;0.5889;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.5889;0.6778'/><circle r='8' fill='#ea580c' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#ea580c' font-family='Segoe UI, Helvetica, Arial, sans-serif'>1000</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M700,100 L530,100' keyPoints='0;0;1;1' keyTimes='0;0.5889;0.6778;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.6778;0.7667'/><circle r='8' fill='#9333ea' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#9333ea' font-family='Segoe UI, Helvetica, Arial, sans-serif'>WS</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M380,120 L205,295' keyPoints='0;0;1;1' keyTimes='0;0.6778;0.7667;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.6778;0.7667'/><circle r='8' fill='#9333ea' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#9333ea' font-family='Segoe UI, Helvetica, Arial, sans-serif'>WS</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M370,112 L200,112' keyPoints='0;0;1;1' keyTimes='0;0.6778;0.7667;1' calcMode='linear'/></g><g opacity='0'><animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.7667;0.8556'/><circle r='8' fill='#16a34a' stroke='white' stroke-width='2'/><text y='-13' text-anchor='middle' font-size='11' font-weight='700' fill='#16a34a' font-family='Segoe UI, Helvetica, Arial, sans-serif'>R2</text><animateMotion dur='9.0s' repeatCount='indefinite' path='M180,290 L355,120' keyPoints='0;0;1;1' keyTimes='0;0.7667;0.8556;1' calcMode='linear'/></g><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>1. Backend dev sends POST /api/history/ {ops:'test', endpoint_str, method}<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.0000;0.1111'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>2. Webserver answers 202 + txn_id at once (does not wait)<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.1111;0.1889'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>3. Webserver spawns edms-child: task 'devapi_history' + db_path<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.1889;0.3000'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>4. Compute checks params, then calls the target endpoint<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.3000;0.3889'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>5. Target answers with status, headers and body<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.3889;0.4778'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>6. Compute checks for a duplicate QP, then stores it (W)<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.4778;0.5889'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>7. Child POSTs the CallResult to /internal/callback, exits<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.5889;0.6778'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>8. WebSocket: UI gets the update event, dev gets the result<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.6778;0.7667'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='600' fill='#1f2937' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>9. UI re-fetches history over REST (R2) and redraws<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.7667;0.9556'/></text><text x='450' y='400' text-anchor='middle' font-size='15' font-weight='400' fill='#6b7280' opacity='0' font-family='Segoe UI, Helvetica, Arial, sans-serif'>loop restarts…<animate attributeName='opacity' dur='9.0s' repeatCount='indefinite' calcMode='discrete' values='0;1;0' keyTimes='0;0.9556;0.9999'/></text></svg>