server:
  host: "0.0.0.0"
  port: 3000

limits:
  max_endpoints: 50000
  max_requests_per_minute: 100
  max_response_size_bytes: 10485760
  max_latency_ms: 5000

stability:
  stable_commit: "f364cb6"
  stable_commit_timestamp: "2026-08-18T00:00:00Z"
  stability_check_timestamp: "2026-08-18T00:00:00Z"

links:
  github: "https://github.com/hashedtokens/edms"
  dockerhub: "https://hub.docker.com/r/hashedtokens/edms"
  wiki: "https://github.com/hashedtokens/edms/wiki"

storage:
  # Single point of configuration for the top-level EDMS data directory
  # (Ravi, 2026-09-14). A RELATIVE path, resolved against the app's
  # working directory. You must create this directory yourself before
  # starting the app — it will not be created for you. It must not be
  # inside this repo or the init/ folder.
  #
  # Left unset by default: the app still runs (falls back to a working
  # location), but flags itself as unconfigured via GET /dashboard/static
  # so the UI can show a warning. Uncomment and point it somewhere real
  # to configure it:
  # root: "../../edms-data"
