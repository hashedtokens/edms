# EDMS Query Configuration
# All SQL queries organized by domain

endpoints:
  E1:
    help: "Insert a new endpoint"
    query: "INSERT INTO endpoints (endpoint_id, endpoint_str, annotation, method) VALUES (?, ?, ?, ?)"

  E2:
    help: "Get endpoint by ID"
    query: "SELECT endpoint_id, endpoint_str, annotation, method FROM endpoints WHERE endpoint_id = ?"

  E3:
    help: "Get all endpoints"
    query: "SELECT endpoint_id, endpoint_str, annotation, method FROM endpoints"

  E4:
    help: "Update endpoint annotation"
    query: "UPDATE endpoints SET annotation = ? WHERE endpoint_id = ?"

  E5:
    help: "Delete endpoint by ID"
    query: "DELETE FROM endpoints WHERE endpoint_id = ?"

  E6:
    help: "Count total endpoints"
    query: "SELECT COUNT(*) FROM endpoints"

  E7:
    help: "Get recent endpoints (ID and path only)"
    query: "SELECT endpoint_id, endpoint_str FROM endpoints ORDER BY updated_at DESC"

  E8:
    help: "Look up an endpoint by its exact (endpoint_str, method) pair — for dedup checks before allocating a new EID"
    query: "SELECT endpoint_id, endpoint_str, annotation, method FROM endpoints WHERE endpoint_str = ? AND method = ?"

requests:
  R1:
    help: "Insert request metadata"
    query: "INSERT INTO request_metadata (endpoint_id, request_number, file_path, method) VALUES (?, ?, ?, ?)"

  R2:
    help: "Get all requests for an endpoint"
    query: "SELECT * FROM request_metadata WHERE endpoint_id = ?"

  R3:
    help: "Get requests for an endpoint ordered by number"
    query: "SELECT * FROM request_metadata WHERE endpoint_id = ? ORDER BY request_number"

  R4:
    help: "Get requests by HTTP method"
    query: "SELECT * FROM request_metadata WHERE method = ?"

  R5:
    help: "Count requests for an endpoint"
    query: "SELECT COUNT(*) FROM request_metadata WHERE endpoint_id = ?"

  R6:
    help: "Get next request number for an endpoint"
    query: "SELECT MAX(request_number) FROM request_metadata WHERE endpoint_id = ?"

  R7:
    help: "Delete request metadata for one QP pair"
    query: "DELETE FROM request_metadata WHERE endpoint_id = ? AND request_number = ?"

  R8:
    help: "List QP pairs for an endpoint — request+response metadata joined, ordered by request number"
    query: "SELECT r.request_number, r.method, r.timestamp, p.status_code, p.response_time_ms FROM request_metadata r LEFT JOIN response_metadata p ON p.endpoint_id = r.endpoint_id AND p.request_number = r.request_number WHERE r.endpoint_id = ? ORDER BY r.request_number"

responses:
  RES1:
    help: "Insert response metadata"
    query: "INSERT INTO response_metadata (endpoint_id, request_number, file_path, status_code, response_time_ms) VALUES (?, ?, ?, ?, ?)"

  RES2:
    help: "Get all responses for an endpoint"
    query: "SELECT * FROM response_metadata WHERE endpoint_id = ?"

  RES3:
    help: "Get all error responses (4xx and 5xx)"
    query: "SELECT * FROM response_metadata WHERE status_code >= 400"

  RES4:
    help: "Calculate average response time for an endpoint"
    query: "SELECT AVG(response_time_ms) FROM response_metadata WHERE endpoint_id = ?"

  RES5:
    help: "Count responses for an endpoint"
    query: "SELECT COUNT(*) FROM response_metadata WHERE endpoint_id = ?"

  RES6:
    help: "Count errors grouped by endpoint"
    query: "SELECT endpoint_id, COUNT(*) FROM response_metadata WHERE status_code >= 400 GROUP BY endpoint_id"

  RES7:
    help: "Get responses by specific status code"
    query: "SELECT * FROM response_metadata WHERE status_code = ?"

  RES8:
    help: "Delete response metadata for one QP pair"
    query: "DELETE FROM response_metadata WHERE endpoint_id = ? AND request_number = ?"

tags:
  T1:
    help: "Insert a tag for an endpoint (idempotent)"
    query: "INSERT OR IGNORE INTO tags (endpoint_id, tag) VALUES (?, ?)"

  T2:
    help: "Get all tags for an endpoint"
    query: "SELECT tag FROM tags WHERE endpoint_id = ?"

  T3:
    help: "Get all endpoints with a specific tag"
    query: "SELECT endpoint_id FROM tags WHERE tag = ?"

  T4:
    help: "Remove a specific tag from an endpoint"
    query: "DELETE FROM tags WHERE endpoint_id = ? AND tag = ?"

  T5:
    help: "Remove all tags for an endpoint"
    query: "DELETE FROM tags WHERE endpoint_id = ?"

  T6:
    help: "Count tags for an endpoint"
    query: "SELECT COUNT(*) FROM tags WHERE endpoint_id = ?"

  T7:
    help: "Get popular tags sorted by usage count"
    query: "SELECT tag, COUNT(*) as count FROM tags GROUP BY tag ORDER BY count DESC"

  T8:
    help: "Rename a tag across all endpoints"
    query: "UPDATE tags SET tag = ? WHERE tag = ?"

history:
  H1:
    help: "Count total history entries"
    query: "SELECT COUNT(*) FROM history"

  H2:
    help: "Clear all history"
    query: "DELETE FROM history"

  H3:
    help: "Insert history entry"
    query: "INSERT INTO history (endpoint_id, action, details) VALUES (?, ?, ?)"

  H4:
    help: "Get all history endpoint IDs ordered by time"
    query: "SELECT endpoint_id FROM history ORDER BY timestamp DESC"

  H5:
    help: "Get all history entries ordered by time"
    query: "SELECT id, endpoint_id, action, details, timestamp FROM history ORDER BY timestamp DESC"

bookmarks:
  B1:
    help: "Count bookmarks in a specific folder"
    query: "SELECT COUNT(*) FROM bookmarks WHERE folder = ?"

  B2:
    help: "Clear bookmarks in a specific folder"
    query: "DELETE FROM bookmarks WHERE folder = ?"

  B3:
    help: "List endpoint IDs for a specific folder ordered by time"
    query: "SELECT endpoint_id FROM bookmarks WHERE folder = ? ORDER BY timestamp DESC"

  B4:
    help: "Check if a specific bookmark exists"
    query: "SELECT COUNT(*) FROM bookmarks WHERE folder = ? AND endpoint_id = ?"

  B5:
    help: "Insert a new bookmark"
    query: "INSERT INTO bookmarks (endpoint_id, folder, notes) VALUES (?, ?, ?)"

  B6:
    help: "Delete a specific bookmark"
    query: "DELETE FROM bookmarks WHERE folder = ? AND endpoint_id = ?"

  B7:
    help: "Insert a bookmark without notes (for copying)"
    query: "INSERT INTO bookmarks (endpoint_id, folder, notes) VALUES (?, ?, NULL)"

  B8:
    help: "List distinct endpoints in a collection that carry any tag from a dynamic IN list (caller expands ? per tag)"
    query: "SELECT DISTINCT b.endpoint_id FROM bookmarks b JOIN tags t ON t.endpoint_id = b.endpoint_id WHERE b.folder = ? AND t.tag IN (?)"

  B9:
    help: "Check whether an endpoint already exists in a collection (dedup guard for merge/create)"
    query: "SELECT COUNT(*) FROM bookmarks WHERE endpoint_id = ? AND folder = ?"

  B10:
    help: "List endpoint IDs + when they were bookmarked, for a specific folder, ordered by time"
    query: "SELECT endpoint_id, timestamp FROM bookmarks WHERE folder = ? ORDER BY timestamp DESC"

# Catalog tables: which collections/webviews/repoviews exist and where their
# independent SQLite file lives (per Ravi, 2026-08-25).
catalog:
  COLLECTIONS_CREATE:
    help: "Register a new collection in the catalog"
    query: "INSERT INTO collections (name, file_path, annotation) VALUES (?, ?, ?)"
  COLLECTIONS_LIST:
    help: "List all registered collections"
    query: "SELECT name, file_path, created_at, annotation FROM collections ORDER BY name"
  COLLECTIONS_GET:
    help: "Get one collection's catalog row by name (to find its file_path)"
    query: "SELECT name, file_path, created_at, annotation FROM collections WHERE name = ?"
  COLLECTIONS_REMOVE:
    help: "Remove a collection's catalog entry (its file is deleted separately)"
    query: "DELETE FROM collections WHERE name = ?"
  COLLECTIONS_RENAME:
    help: "Rename a collection and repoint its file_path to match (the file itself is renamed separately on disk)"
    query: "UPDATE collections SET name = ?, file_path = ? WHERE name = ?"
  COLLECTIONS_ANNOTATE:
    help: "Set a collection's annotation"
    query: "UPDATE collections SET annotation = ? WHERE name = ?"
  WEBVIEW_CREATE:
    help: "Register a new webview in the catalog"
    query: "INSERT INTO webview (name, file_path, annotation) VALUES (?, ?, ?)"
  WEBVIEW_LIST:
    help: "List all registered webviews"
    query: "SELECT name, file_path, created_at, annotation FROM webview ORDER BY name"
  WEBVIEW_GET:
    help: "Get one webview's catalog row by name (to find its file_path)"
    query: "SELECT name, file_path, created_at, annotation FROM webview WHERE name = ?"
  WEBVIEW_REMOVE:
    help: "Remove a webview's catalog entry"
    query: "DELETE FROM webview WHERE name = ?"
  WEBVIEW_RENAME:
    help: "Rename a webview and repoint its file_path to match"
    query: "UPDATE webview SET name = ?, file_path = ? WHERE name = ?"
  WEBVIEW_ANNOTATE:
    help: "Set a webview's annotation"
    query: "UPDATE webview SET annotation = ? WHERE name = ?"
  REPOVIEW_CREATE:
    help: "Register a new repoview in the catalog"
    query: "INSERT INTO repoview (name, file_path, annotation) VALUES (?, ?, ?)"
  REPOVIEW_LIST:
    help: "List all registered repoviews"
    query: "SELECT name, file_path, created_at, annotation FROM repoview ORDER BY name"
  REPOVIEW_GET:
    help: "Get one repoview's catalog row by name (to find its file_path)"
    query: "SELECT name, file_path, created_at, annotation FROM repoview WHERE name = ?"
  REPOVIEW_REMOVE:
    help: "Remove a repoview's catalog entry"
    query: "DELETE FROM repoview WHERE name = ?"
  REPOVIEW_RENAME:
    help: "Rename a repoview and repoint its file_path to match"
    query: "UPDATE repoview SET name = ?, file_path = ? WHERE name = ?"
  REPOVIEW_ANNOTATE:
    help: "Set a repoview's annotation"
    query: "UPDATE repoview SET annotation = ? WHERE name = ?"

# Central per-view-type tag count rollups (tagname, count) — incrementally
# maintained counters, not a full tag entity with membership tracking.
view_tag_counts:
  COLLECTIONS_UPSERT:
    help: "Create a collections tag, or add to its count if it already exists"
    query: "INSERT INTO collections_tags (tagname, count) VALUES (?, ?) ON CONFLICT(tagname) DO UPDATE SET count = count + excluded.count"
  COLLECTIONS_GET:
    help: "Get a collections tag's current count"
    query: "SELECT count FROM collections_tags WHERE tagname = ?"
  COLLECTIONS_DELETE:
    help: "Delete a collections tag"
    query: "DELETE FROM collections_tags WHERE tagname = ?"
  COLLECTIONS_LIST_TAGS:
    help: "List all collections tags with their counts"
    query: "SELECT tagname, count FROM collections_tags ORDER BY tagname"
  WEBVIEW_UPSERT:
    help: "Create a webview tag, or add to its count if it already exists"
    query: "INSERT INTO webview_tags (tagname, count) VALUES (?, ?) ON CONFLICT(tagname) DO UPDATE SET count = count + excluded.count"
  WEBVIEW_GET:
    help: "Get a webview tag's current count"
    query: "SELECT count FROM webview_tags WHERE tagname = ?"
  WEBVIEW_DELETE:
    help: "Delete a webview tag"
    query: "DELETE FROM webview_tags WHERE tagname = ?"
  WEBVIEW_LIST_TAGS:
    help: "List all webview tags with their counts"
    query: "SELECT tagname, count FROM webview_tags ORDER BY tagname"
  REPOVIEW_UPSERT:
    help: "Create a repoview tag, or add to its count if it already exists"
    query: "INSERT INTO repoview_tags (tagname, count) VALUES (?, ?) ON CONFLICT(tagname) DO UPDATE SET count = count + excluded.count"
  REPOVIEW_GET:
    help: "Get a repoview tag's current count"
    query: "SELECT count FROM repoview_tags WHERE tagname = ?"
  REPOVIEW_DELETE:
    help: "Delete a repoview tag"
    query: "DELETE FROM repoview_tags WHERE tagname = ?"
  REPOVIEW_LIST_TAGS:
    help: "List all repoview tags with their counts"
    query: "SELECT tagname, count FROM repoview_tags ORDER BY tagname"

merge:
  M_CLASSIFY:
    help: "Classify source endpoints against target collection (requires dynamic IN clause at the end)"
    query: "SELECT src.endpoint_id, src.endpoint_str, COALESCE(src.method,'') AS method, src.annotation, target.endpoint_id AS target_eid FROM endpoints src LEFT JOIN (SELECT e.endpoint_id, e.endpoint_str, COALESCE(e.method,'') AS method FROM endpoints e JOIN bookmarks b ON b.endpoint_id = e.endpoint_id WHERE b.folder = ? GROUP BY e.endpoint_str, COALESCE(e.method,'')) target ON target.endpoint_str = src.endpoint_str AND target.method = COALESCE(src.method,'') WHERE src.endpoint_id IN "
  M_UNION_TAGS:
    help: "Union tags from source endpoint to target endpoint"
    query: "INSERT OR IGNORE INTO tags (endpoint_id, tag) SELECT ?, tag FROM tags WHERE endpoint_id = ?"
  M_INSERT_EP:
    help: "Insert net-new endpoint"
    query: "INSERT INTO endpoints (endpoint_id, endpoint_str, annotation, method) VALUES (?, ?, ?, ?)"
  M_INSERT_BM:
    help: "Idempotent bookmark insert"
    query: "INSERT OR IGNORE INTO bookmarks (endpoint_id, folder, notes) VALUES (?, ?, NULL)"
  CT_INSERT:
    help: "Insert collection-level tag"
    query: "INSERT OR IGNORE INTO collection_tag_memberships (collection_name, tagname) VALUES (?, ?)"
  CT_DELETE:
    help: "Delete collection-level tag"
    query: "DELETE FROM collection_tag_memberships WHERE collection_name = ? AND tagname = ?"
  CT_LIST:
    help: "List tags for a collection"
    query: "SELECT tagname FROM collection_tag_memberships WHERE collection_name = ? ORDER BY tagname"
  CT_COLLECTIONS_BY_TAG:
    help: "List collections having a specific tag"
    query: "SELECT collection_name FROM collection_tag_memberships WHERE tagname = ? ORDER BY collection_name"
  CT_MERGE:
    help: "Merge collection tags from source to target"
    query: "INSERT OR IGNORE INTO collection_tag_memberships (collection_name, tagname) SELECT ?, tagname FROM collection_tag_memberships WHERE collection_name = ?"

# Per-collection endpoint membership — run against ONE collection's own
# SQLite file (storage/collections/{name}.sqlite), not the shared edms.db.
# Per Ravi (2026-09-03): each collection file holds just endpoint_id +
# when it was added — no folder column needed, the file itself is the
# scope. Not to be confused with collection_tag_memberships (merge/? above),
# which tracks TAG presence per collection in the shared db, not endpoints.
collection_membership:
  ADD:
    help: "Add an endpoint to this collection's file (idempotent)"
    query: "INSERT OR IGNORE INTO membership (endpoint_id) VALUES (?)"
  REMOVE:
    help: "Remove an endpoint from this collection's file"
    query: "DELETE FROM membership WHERE endpoint_id = ?"
  LIST:
    help: "List all endpoints in this collection's file, oldest-added first"
    query: "SELECT endpoint_id, added_at FROM membership ORDER BY added_at"
  COUNT:
    help: "Count endpoints in this collection's file"
    query: "SELECT COUNT(*) FROM membership"
  ADD_TAG:
    help: "Add a tag to an endpoint within this collection's file (idempotent)"
    query: "INSERT OR IGNORE INTO endpoint_tags (endpoint_id, tag) VALUES (?, ?)"
  COUNT_TAGS_FOR_ENDPOINT:
    help: "Count tags an endpoint already carries in this collection's file"
    query: "SELECT COUNT(*) FROM endpoint_tags WHERE endpoint_id = ?"
  LIST_TAGS_FOR_ENDPOINT:
    help: "List tags an endpoint carries in this collection's file"
    query: "SELECT tag FROM endpoint_tags WHERE endpoint_id = ?"
  LIST_ALL_ENDPOINT_TAGS:
    help: "List every (endpoint_id, tag) pair carried in this collection's file"
    query: "SELECT endpoint_id, tag FROM endpoint_tags ORDER BY endpoint_id, tag"
